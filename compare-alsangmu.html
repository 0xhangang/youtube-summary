<script>
  (function () {
    try {
      var saved = localStorage.getItem('yts.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();

<style>
  /* 비교 페이지 전용 크롬 — 카드 본문은 사이트 style.css 그대로 */
  .cg-wrap { max-width: 820px; margin: 0 auto; padding: 10px 10px 72px; }

  .cg-head {
    display: flex; align-items: center; gap: 12px;
    margin: 2px 0 10px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: var(--shadow-card);
  }
  .cg-thumb-link { flex: 0 0 84px; display: block; line-height: 0; border-radius: 10px; }
  .cg-thumb {
    width: 84px; height: 48px;
    border-radius: 10px; object-fit: cover; background: var(--surface-3);
    border: 1px solid var(--border);
  }
  .cg-head-txt { flex: 1 1 auto; min-width: 0; }
  .cg-kicker {
    font-size: 10.5px; font-weight: 800; letter-spacing: -0.1px;
    color: var(--accent-strong); margin-bottom: 3px;
  }
  [data-theme="dark"] .cg-kicker { color: var(--accent); }
  .cg-title {
    margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;
    letter-spacing: -0.35px; color: var(--text); word-break: keep-all;
    white-space: normal; overflow: visible; text-overflow: clip;
  }
  .cg-sub {
    margin-top: 3px; font-size: 11.5px; line-height: 1.5;
    color: var(--text-faint); word-break: keep-all;
  }
  .cg-sub b { color: var(--text-sub); font-weight: 700; }
  .cg-sub a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
  [data-theme="dark"] .cg-sub a { color: var(--accent); }
  .cg-head .btn { flex: 0 0 auto; }

  /* A/B/C 전환 탭 — 스크롤해도 상단 고정 */
  .cg-tabs {
    position: sticky; top: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
    margin: 0 -2px 8px; padding: 8px 2px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    backdrop-filter: blur(14px) saturate(1.15);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  }
  .cg-tab {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    min-width: 0; padding: 8px 10px 9px;
    border: 1px solid var(--border); border-radius: 13px;
    background: var(--surface); color: var(--text-sub);
    font-family: inherit; text-align: left; cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .cg-tab:hover { border-color: var(--border-strong); }
  .cg-tab:active { transform: scale(0.985); }
  .cg-tab[aria-selected="true"] {
    border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .cg-tab-k {
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--accent-strong); line-height: 1.2;
  }
  [data-theme="dark"] .cg-tab-k { color: var(--accent); }
  .cg-tab-t {
    font-size: 13px; font-weight: 800; letter-spacing: -0.25px;
    color: var(--text-sub); line-height: 1.35; word-break: keep-all;
  }
  .cg-tab[aria-selected="true"] .cg-tab-t { color: var(--text); }
  .cg-tab-m {
    font-size: 10px; line-height: 1.35; color: var(--text-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }

  .cg-note {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px;
    margin: 0 2px 12px; font-size: 12px; line-height: 1.55;
    color: var(--text-sub); word-break: keep-all;
  }
  .cg-note-k {
    display: inline-flex; align-items: center; height: 19px; padding: 0 8px;
    border-radius: 999px; background: var(--accent-soft);
    color: var(--accent-strong); font-size: 10.5px; font-weight: 800;
  }
  [data-theme="dark"] .cg-note-k { color: var(--accent); }
  .cg-note-hint { color: var(--text-faint); }

  .cg-card-foot {
    padding: 12px 18px 15px; border-top: 1px solid var(--border);
    background: var(--surface-2); font-size: 11.5px; line-height: 1.6;
    color: var(--text-faint); word-break: keep-all;
  }
  .cg-card-foot a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
  [data-theme="dark"] .cg-card-foot a { color: var(--accent); }

  @media (max-width: 430px) {
    .cg-head { padding: 10px 12px; gap: 10px; }
    .cg-thumb-link { flex-basis: 68px; }
    .cg-thumb { width: 68px; height: 39px; }
    .cg-title { font-size: 14px; }
    .cg-tab { padding: 7px 8px 8px; }
    .cg-tab-t { font-size: 12px; }
    .cg-tab-m { font-size: 9.5px; }
  }
  @media (max-width: 360px) {
    .cg-tab-m { display: none; }
  }
</style>
</head>

린한 지수입니다. 내년 1월 중순쯤 주요 이평선들이 내려와 만나는 지점에서 추가 돌파 시 CTA 추종 매수와 쇼트커버가 붙을 여지도 있습니다."},{"type":"p","text":"원/달러 환율은 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 자리라, 다음 주에도 검은선 위에서 버틴다면 기술적으로 다시 위쪽 방향을 볼 수 있는 흐름입니다."},{"type":"p","text":"어제·오늘은 미국 추수감사절 연휴라 양놈 형님들이 안 계신 가벼운 장이었습니다. 월요일(11월 30일) 11월 마지막 영업일에 형님들이 돌아와서 \"어? 많이 올랐네\" 하고 두들겨 팰 수도 있으니 들뜨지 마세요. 크리스마스 연휴(12월 FOMC 이후 12일경부터)엔 플레이어가 아예 사라지므로 **12월 둘째 주**까지 적정 수익을 내고 올해 매매를 정리하는 걸 목표로 삼으시길 권합니다."},{"type":"h","text":"반도체 쏠림의 함정과 52주 신고가·매크로 지표"},{"type":"p","text":"주간으로 삼성전자·하이닉스가 약했던 건 외국인이 개별 기업이 싫어서가 아니라 아시아와 AI 반도체를 묶어서 팔고 있기 때문입니다. 우리나라는 패시브·액티브·가치주·배당주 펀드까지 전부 삼성전자 비중을 의무적으로 채워야 하는 구조라 다양성이 없고, 배당 세제 변화 같은 이슈로 펀드가 깨지면 삼성전자 매물이 쏟아지는 취약점이 있습니다."},{"type":"p","text":"이번 주 코스피에서는 한진칼(경영권 분쟁으로 월간 **+105%**), 코스맥스, 한미사이언스가, 코스닥에서는 화장품 용기 테마의 펌텍코리아와 정치 테마가 붙은 안랩이 52주 신고가를 기록했습니다. 시총 상위주가 막힐 때 로봇·화장품 같은 지엽적 테마가 도는 건 전체 장이 아직 강하지 않다는 방증이기도 합니다."},{"type":"p","text":"미국 3분기 GDP가 **4.3%**, 근원 PCE가 **3.3%**로 나오면서 명목상 약 7%대 상승 압력이 확인됐고 12월 금리 인상 우려가 커졌습니다. 시중에 \"현금을 두면 돈이 녹으니 무조건 투자해야 한다\"는 말이 돌지만, 잘못 투자하면 녹는 게 아니라 그냥 타서 사라진다는 점도 기억하셔야 합니다."},{"type":"h","text":"글로벌 빅테크·AI 인프라 점검: 엔비디아·마이크론·인텔"},{"type":"p","text":"가격 지표를 여러 개 같이 보다 보면 먼저 방향을 틀기 시작하는 녀석들이 보입니다. 지금 원/달러, 코스닥, 금리(한 달 전 전환), 원유(15~20일 전 전환)가 변화를 보여주고 있어 시장 전체의 변곡점이 가까워지고 있는 건 맞지만, 대형 기술주 차트는 아직 갈 길이 멉니다."},{"type":"p","text":"삼성전자와 하이닉스가 돌아서지 않으면 지수 전체가 몇 달 더 횡보할 수 있습니다. 현대차도 20일선에 간신히 붙었지만 차트상 매수할 매력은 아직 안 보입니다. 반면 APR은 실적은 탄탄한데 수급·환율 이슈로 눌려 있던 거라 다음 주 양봉이 서면 위쪽 여력이 있습니다."},{"type":"p","text":"엔비디아와 마이크론 테크놀로지, 일본 키옥시아, 소프트뱅크 그룹은 하락 가속도가 붙거나 악성 매물이 많아 당분간 어렵습니다. 차라리 미국장에 가실 거면 구글이나 메타 같은 하이퍼스케일러 쪽이 낫습니다. 인텔은 정부 지원금을 넣기 직전 자리까지 밀려나며 상업적 경쟁력 한계가 드러났습니다."},{"type":"h","text":"디지털 불멸, 젠슨 황의 복귀, 그리고 마가(MAGA) 진영의 균열"},{"type":"p","text":"오늘은 주식 차트 너머의 미국 정치 지형 변화를 말씀드리고 싶습니다. 최근 일론 머스크가 아이들을 데리고 젠슨 황을 찾아가 사진을 찍었는데, 불과 며칠 전(11월 18~19일) 머스크는 뉴욕타임스 딜북 서밋과 CNBC 인터뷰에서 \"나는 MAGA가 아니다(I'm not sure what MAGA is)\"라며 공화당 후원을 후회하는 듯한 발언을 했습니다. 뭔가 불안감을 느낀 두 사람이 동지애로 뭉친 모양새입니다."},{"type":"p","text":"미국 최대 단일 개신교 교단인 남침례회(등록 교인 **1,233만 명**)는 '브랜트우드 선언(Brentwood Declaration)'을 통해 AI로 고인을 모방하거나 인간과 기계의 경계를 모호하게 만드는 디지털 불멸 기술에 선을 그었습니다. 이들은 MAGA와 트럼프의 핵심 지지 기반이지만, 본질적으로 AI 만능주의나 세속적 도덕 해이와는 충돌할 수밖에 없습니다."},{"type":"p","text":"젠슨 황의 초고속 복귀를 두고 세속 언론은 중국 관련 리스크를 따지지만, 보수 기독교 지지층은 트럼프가 불륜 및 윤리적 문제에 노골적인 면제부를 주는 모습에 큰 배신감과 괴리감을 느끼고 있습니다. 실제로 악시오스(Axios)에서도 젠슨 황 복귀를 계기로 MAGA 진영이 분열되고 있다는 보도가 나왔습니다."},{"type":"h","text":"드라마 〈홈랜드〉로 본 미국의 균열과 한국 증시의 상대적 기회"},{"type":"p","text":"중요한 건 팩트가 아니라 대중의 머릿속에 어떤 이미지가 자리 잡느냐입니다. 마리 앙투아네트가 \"빵이 없으면 케이크(고기)를 먹으면 되지\"라고 실제로 말했는지는 불분명하지만 대중의 증오를 샀듯, 미국 드라마 〈홈랜드(Homeland)〉 시즌 1 에피소드 11에서도 테러 위험 속 벙커에 격리된 부통령이 \"사우디아라비아는 건드리지 말고 아무나 한 명 잘라\"라고 지시하는 모습이 그려집니다. 미국 남부 보수층이 혐오하던 '딥스테이트'의 전형을 이제는 트럼프 본인이 닮아가고 있다는 인식이 MAGA 내부에 퍼지고 있습니다."},{"type":"callout","text":"트럼프가 공화당 내 레임덕에 빠져 집단지도체제(J.D. 밴스 등)로 빠르게 넘어가면 불확실성이 줄어 증시에 호재겠지만, 그립을 놓지 않으려 버티면 향후 6개월간 미국 정치발 혼란이 이어질 수 있습니다. 오히려 스타게이트 등 트럼프 관련 사업들이 정리되면서 당분간 미국장보다 먼저 빠진 한국장이 상대적으로 나을 수도 있다는 게 제 생각입니다."},{"type":"p","text":"오늘 낮에 KB증권 이은택 연구원과 만나 대중 앞에서 이야기하는 고충에 대해 대화를 나눴는데, 결국 세상도 시장도 우리가 생각하는 것만큼 정교하거나 합리적이지 않습니다. 올해 역대급 상승장에서 아쉽게 수익을 못 내셨더라도 너무 자책하지 마시고 운이 조금 없었을 뿐이라 생각하시며, 다음 반등 타이밍을 저와 함께 차분히 노려보시죠. 금요일 RTS 여기서 마치겠습니다. 감사합니다."}]},"b":{"key":"B","name":"밸런스 추천","diff":"지금 사이트 그대로 — 문단 + 회색 불릿 박스 + 초록 인용 · 시각화 2개(오늘의 숫자 · 코스닥 타점)","blocks":[{"type":"h","text":"코스닥 트레이딩 복기: '금쪽이'에게 밸류를 묻지 마세요"},{"type":"p","text":"금요일 RTS(알스 트레이딩 스테이션) 시작하겠습니다. 이번에 코스닥을 어떻게 대해야 하는지 다들 다시 한번 경험하셨을 텐데요, 코스닥에다 대고 \"네 가치를 증명해 봐\"라며 밸류를 따지면 안 됩니다. 코스닥은 그냥 **금쪽이** 같은 친구라 올라가면 잘한다 잘한다 해주고, 내려가면 안타깝구나 하며 내버려 둬야지, 잔뜩 들어가서 물려버리면 답이 없습니다."},{"type":"ul","items":["**666 돌파 매수와 빠른 차익 실현**: 사실 코스닥이 상대적으로 유리해 보이는 이유를 여덟 가지 정도 꼽을 수는 있지만, 그걸 머리에 넣고 고집을 부리면 또 잃습니다. 저는 650 부근에서 조금씩 담다가 666 돌파를 보고(실제 체결은 669) **코스닥 150 추종 ETF**를 들어갔는데, 오늘 6~7% 급등이 나와서 감사히 일부 차익 실현을 했습니다.","**본진은 따로 있다**: 코스닥은 가볍게 먹고 빠져서 자신감과 수익을 쌓는 용도지, 이걸로 일가를 이루겠다고 덤비면 안 됩니다. 진짜 큰돈은 결국 우리 본진인 **삼성전자와 SK하이닉스**가 다시 돌아설 때 벌어야 합니다."]},{"type":"callout","text":"단기 차익 실현이 좋은 이유는 밤에 잠을 잘 수 있고 주말에 편히 놀 수 있으며, 번 돈으로 다음 베팅을 할 수 있기 때문입니다. 코스피 고점(6월 19일) 이후 6개월가량 조정을 받았으니 시간적으로도 반등이 나올 만한 구간에 와 있습니다."},{"type":"h","text":"코스피·코스닥·환율 차트 점검과 연말 매매 전략"},{"type":"p","text":"오늘 코스피는 장 초반 약세를 딛고 양봉으로 **+4.34%** 상승 마감했고, 외국인도 프리장 포함 약 **11.5조 원** 순매수하며 오랜만에 힘을 보탰습니다. 다만 주봉으로 보면 겨우 **+0.94%** 양봉이고 여전히 20일·60일·120일 이평선이 위에 있어 추세 자체가 완전히 돌았다고 보기엔 이릅니다. 그래도 개인들이 절망해서 던지기보다 멘탈을 다잡고 미련을 버린 점이 반등의 준비 신호로 읽힙니다."},{"type":"stats","title":"오늘의 숫자","items":[{"label":"코스피","value":"+4.34%","sub":"주봉은 +0.94%","tone":"accent"},{"label":"코스닥","value":"708p","sub":"+8% · 주간 +9.8%","tone":"accent"},{"label":"외국인 순매수","value":"11.5조 원","sub":"프리장 포함","tone":"blue"},{"label":"코스닥 150 추종 ETF","value":"+6~7%","sub":"일부 차익 실현","tone":"amber"}]},{"type":"ul","items":["**코스닥(+8%, 주간 +9.8%)의 강점**: 코스닥은 708포인트로 마감했는데, 신용잔고가 **2025년 1월 이후 약 2년 내 최저치**까지 줄어들어 악성 매물이 싹 정리된 클린한 지수입니다. 내년 1월 중순쯤 주요 이평선들이 내려와 만나는 지점에서 추가 돌파 시 CTA 추종 매수와 쇼트커버가 붙을 여지도 있습니다.","**원/달러 환율**: 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 자리라, 다음 주에도 검은선 위에서 버틴다면 기술적으로 다시 위쪽 방향을 볼 수 있는 흐름입니다.","**연휴 장세와 크리스마스 경고**: 어제·오늘은 미국 추수감사절 연휴라 양놈 형님들이 안 계신 가벼운 장이었습니다. 월요일(11월 30일) 11월 마지막 영업일에 형님들이 돌아와서 \"어? 많이 올랐네\" 하고 두들겨 팰 수도 있으니 들뜨지 마세요. 크리스마스 연휴(12월 FOMC 이후 12일경부터)엔 플레이어가 아예 사라지므로 **12월 둘째 주까지 적정 수익을 내고 올해 매매를 정리**하는 걸 목표로 삼으시길 권합니다."]},{"type":"levels","title":"코스닥 — 650 분할 매수에서 708 종가까지","unit":"p","levels":[{"price":708,"label":"오늘 종가 (+8%, 주간 +9.8%)","tone":"accent"},{"price":669,"label":"666 돌파 확인 후 매수 (실제 체결 669)","tone":"blue"},{"price":650,"label":"1차 분할 매수 구간","tone":"violet"}]},{"type":"h","text":"반도체 쏠림의 함정과 52주 신고가·매크로 지표"},{"type":"p","text":"주간으로 삼성전자·하이닉스가 약했던 건 외국인이 개별 기업이 싫어서가 아니라 아시아와 AI 반도체를 묶어서 팔고 있기 때문입니다. 우리나라는 패시브·액티브·가치주·배당주 펀드까지 전부 삼성전자 비중을 의무적으로 채워야 하는 구조라 다양성이 없고, 배당 세제 변화 같은 이슈로 펀드가 깨지면 삼성전자 매물이 쏟아지는 취약점이 있습니다."},{"type":"ul","items":["**52주 신고가 종목**: 이번 주 코스피에서는 **한진칼**(경영권 분쟁으로 월간 +105%), **코스맥스**, **한미사이언스**가, 코스닥에서는 화장품 용기 테마의 **펌텍코리아**와 정치 테마가 붙은 **안랩**이 52주 신고가를 기록했습니다. 시총 상위주가 막힐 때 로봇·화장품 같은 지엽적 테마가 도는 건 전체 장이 아직 강하지 않다는 방증이기도 합니다.","**미국 매크로와 인플레이션 딜레마**: 미국 3분기 GDP가 **4.3%**, 근원 PCE가 **3.3%**로 나오면서 명목상 약 7%대 상승 압력이 확인됐고 12월 금리 인상 우려가 커졌습니다. 시중에 \"현금을 두면 돈이 녹으니 무조건 투자해야 한다\"는 말이 돌지만, 잘못 투자하면 녹는 게 아니라 **그냥 타서 사라진다**는 점도 기억하셔야 합니다."]},{"type":"h","text":"글로벌 빅테크·AI 인프라 점검: 엔비디아·마이크론·인텔"},{"type":"p","text":"가격 지표를 여러 개 같이 보다 보면 먼저 방향을 틀기 시작하는 녀석들이 보입니다. 지금 원/달러, 코스닥, 금리(한 달 전 전환), 원유(15~20일 전 전환)가 변화를 보여주고 있어 시장 전체의 변곡점이 가까워지고 있는 건 맞지만, 대형 기술주 차트는 아직 갈 길이 멉니다."},{"type":"ul","items":["**삼성전자·하이닉스·현대차**: 삼성전자와 하이닉스가 돌아서지 않으면 지수 전체가 몇 달 더 횡보할 수 있습니다. 현대차도 20일선에 간신히 붙었지만 차트상 매수할 매력은 아직 안 보입니다. 반면 **APR**은 실적은 탄탄한데 수급·환율 이슈로 눌려 있던 거라 다음 주 양봉이 서면 위쪽 여력이 있습니다.","**미국 AI 반도체 vs 하이퍼스케일러**: **엔비디아**와 **마이크론 테크놀로지**, 일본 **키옥시아**, **소프트뱅크 그룹**은 하락 가속도가 붙거나 악성 매물이 많아 당분간 어렵습니다. 차라리 미국장에 가실 거면 **구글이나 메타 같은 하이퍼스케일러** 쪽이 낫습니다. **인텔**은 정부 지원금을 넣기 직전 자리까지 밀려나며 상업적 경쟁력 한계가 드러났습니다."]},{"type":"h","text":"디지털 불멸, 젠슨 황의 복귀, 그리고 마가(MAGA) 진영의 균열"},{"type":"p","text":"오늘은 주식 차트 너머의 미국 정치 지형 변화를 말씀드리고 싶습니다. 최근 일론 머스크가 아이들을 데리고 젠슨 황을 찾아가 사진을 찍었는데, 불과 며칠 전(11월 18~19일) 머스크는 뉴욕타임스 딜북 서밋과 CNBC 인터뷰에서 **\"나는 MAGA가 아니다(I'm not sure what MAGA is)\"**라며 공화당 후원을 후회하는 듯한 발언을 했습니다. 뭔가 불안감을 느낀 두 사람이 동지애로 뭉친 모양새입니다."},{"type":"ul","items":["**남침례회와 '브랜트우드 선언'**: 미국 최대 단일 개신교 교단인 남침례회(등록 교인 1,233만 명)는 **'브랜트우드 선언(Brentwood Declaration)'**을 통해 AI로 고인을 모방하거나 인간과 기계의 경계를 모호하게 만드는 디지털 불멸 기술에 선을 그었습니다. 이들은 MAGA와 트럼프의 핵심 지지 기반이지만, 본질적으로 AI 만능주의나 세속적 도덕 해이와는 충돌할 수밖에 없습니다.","**젠슨 황 복귀가 건드린 역린**: 젠슨 황의 초고속 복귀를 두고 세속 언론은 중국 관련 리스크를 따지지만, 보수 기독교 지지층은 트럼프가 불륜 및 윤리적 문제에 노골적인 면제부를 주는 모습에 큰 배신감과 괴리감을 느끼고 있습니다. 실제로 **악시오스(Axios)**에서도 젠슨 황 복귀를 계기로 MAGA 진영이 분열되고 있다는 보도가 나왔습니다."]},{"type":"h","text":"드라마 〈홈랜드〉로 본 미국의 균열과 한국 증시의 상대적 기회"},{"type":"p","text":"중요한 건 팩트가 아니라 대중의 머릿속에 어떤 이미지가 자리 잡느냐입니다. 마리 앙투아네트가 \"빵이 없으면 케이크(고기)를 먹으면 되지\"라고 실제로 말했는지는 불분명하지만 대중의 증오를 샀듯, 미국 드라마 **〈홈랜드(Homeland)〉 시즌 1 에피소드 11**에서도 테러 위험 속 벙커에 격리된 부통령이 \"사우디아라비아는 건드리지 말고 아무나 한 명 잘라\"라고 지시하는 모습이 그려집니다. 미국 남부 보수층이 혐오하던 '딥스테이트'의 전형을 이제는 **트럼프 본인이 닮아가고 있다**는 인식이 MAGA 내부에 퍼지고 있습니다."},{"type":"callout","text":"트럼프가 공화당 내 레임덕에 빠져 집단지도체제(J.D. 밴스 등)로 빠르게 넘어가면 불확실성이 줄어 증시에 호재겠지만, 그립을 놓지 않으려 버티면 향후 6개월간 미국 정치발 혼란이 이어질 수 있습니다. 오히려 스타게이트 등 트럼프 관련 사업들이 정리되면서 **당분간 미국장보다 먼저 빠진 한국장이 상대적으로 나을 수도 있다**는 게 제 생각입니다."},{"type":"p","text":"오늘 낮에 KB증권 **이은택 연구원**과 만나 대중 앞에서 이야기하는 고충에 대해 대화를 나눴는데, 결국 세상도 시장도 우리가 생각하는 것만큼 정교하거나 합리적이지 않습니다. 올해 역대급 상승장에서 아쉽게 수익을 못 내셨더라도 너무 자책하지 마시고 운이 조금 없었을 뿐이라 생각하시며, 다음 반등 타이밍을 저와 함께 차분히 노려보시죠. 금요일 RTS 여기서 마치겠습니다. 감사합니다."}]},"c":{"key":"C","name":"리치 풀시각화","diff":"본문 그대로 + 섹션마다 시각화 — 숫자·타점·자유형 SVG 2개·비교 카드·흐름도·표","blocks":[{"type":"h","text":"코스닥 트레이딩 복기: '금쪽이'에게 밸류를 묻지 마세요"},{"type":"p","text":"금요일 RTS(알스 트레이딩 스테이션) 시작하겠습니다. 이번에 코스닥을 어떻게 대해야 하는지 다들 다시 한번 경험하셨을 텐데요, 코스닥에다 대고 \"네 가치를 증명해 봐\"라며 밸류를 따지면 안 됩니다. 코스닥은 그냥 **금쪽이** 같은 친구라 올라가면 잘한다 잘한다 해주고, 내려가면 안타깝구나 하며 내버려 둬야지, 잔뜩 들어가서 물려버리면 답이 없습니다."},{"type":"ul","items":["**666 돌파 매수와 빠른 차익 실현**: 사실 코스닥이 상대적으로 유리해 보이는 이유를 여덟 가지 정도 꼽을 수는 있지만, 그걸 머리에 넣고 고집을 부리면 또 잃습니다. 저는 650 부근에서 조금씩 담다가 666 돌파를 보고(실제 체결은 669) **코스닥 150 추종 ETF**를 들어갔는데, 오늘 6~7% 급등이 나와서 감사히 일부 차익 실현을 했습니다.","**본진은 따로 있다**: 코스닥은 가볍게 먹고 빠져서 자신감과 수익을 쌓는 용도지, 이걸로 일가를 이루겠다고 덤비면 안 됩니다. 진짜 큰돈은 결국 우리 본진인 **삼성전자와 SK하이닉스**가 다시 돌아설 때 벌어야 합니다."]},{"type":"callout","text":"단기 차익 실현이 좋은 이유는 밤에 잠을 잘 수 있고 주말에 편히 놀 수 있으며, 번 돈으로 다음 베팅을 할 수 있기 때문입니다. 코스피 고점(6월 19일) 이후 6개월가량 조정을 받았으니 시간적으로도 반등이 나올 만한 구간에 와 있습니다."},{"type":"h","text":"코스피·코스닥·환율 차트 점검과 연말 매매 전략"},{"type":"p","text":"오늘 코스피는 장 초반 약세를 딛고 양봉으로 **+4.34%** 상승 마감했고, 외국인도 프리장 포함 약 **11.5조 원** 순매수하며 오랜만에 힘을 보탰습니다. 다만 주봉으로 보면 겨우 **+0.94%** 양봉이고 여전히 20일·60일·120일 이평선이 위에 있어 추세 자체가 완전히 돌았다고 보기엔 이릅니다. 그래도 개인들이 절망해서 던지기보다 멘탈을 다잡고 미련을 버린 점이 반등의 준비 신호로 읽힙니다."},{"type":"stats","title":"오늘의 숫자","items":[{"label":"코스피","value":"+4.34%","sub":"주봉은 +0.94%","tone":"accent"},{"label":"코스닥","value":"708p","sub":"+8% · 주간 +9.8%","tone":"accent"},{"label":"외국인 순매수","value":"11.5조 원","sub":"프리장 포함","tone":"blue"},{"label":"코스닥 150 추종 ETF","value":"+6~7%","sub":"일부 차익 실현","tone":"amber"}]},{"type":"svg","title":"코스피 — 6/19 고점 뒤 6개월 조정, 오늘 양봉","svg":"<svg viewBox=\"0 0 340 180\" role=\"img\" aria-label=\"코스피 6월 19일 고점 이후 6개월 조정과 오늘 반등 개념도\"><line x1=\"24\" y1=\"150\" x2=\"322\" y2=\"150\" style=\"stroke:var(--border-strong);stroke-width:1\"/><line x1=\"60\" y1=\"58\" x2=\"322\" y2=\"53\" style=\"stroke:var(--tone-violet);stroke-width:1.2;stroke-dasharray:5 5;opacity:.85\"/><line x1=\"60\" y1=\"72\" x2=\"322\" y2=\"67\" style=\"stroke:var(--tone-amber);stroke-width:1.2;stroke-dasharray:5 5;opacity:.85\"/><line x1=\"60\" y1=\"86\" x2=\"322\" y2=\"81\" style=\"stroke:var(--tone-blue);stroke-width:1.2;stroke-dasharray:5 5;opacity:.85\"/><polyline points=\"24,128 40,120 52,106 64,86 76,40 88,56 100,72 112,86 124,98 136,110 148,116 160,124 172,120 184,128 196,134 208,126 220,132 232,128 244,134 256,128 268,132 280,124 292,112 304,102\" style=\"fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round\"/><circle cx=\"76\" cy=\"40\" r=\"3.4\" style=\"fill:var(--accent)\"/><text x=\"84\" y=\"34\" style=\"fill:var(--text);font-weight:700\">6/19 고점</text><text x=\"148\" y=\"147\" style=\"fill:var(--text-faint)\">약 6개월 조정</text><text x=\"148\" y=\"51\" style=\"fill:var(--tone-violet)\">120일선</text><text x=\"148\" y=\"65\" style=\"fill:var(--tone-amber)\">60일선</text><text x=\"148\" y=\"79\" style=\"fill:var(--tone-blue)\">20일선</text><text x=\"250\" y=\"96\" style=\"fill:var(--accent);font-weight:700\">오늘 +4.34%</text><line x1=\"304\" y1=\"102\" x2=\"304\" y2=\"148\" style=\"stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.55\"/><circle cx=\"304\" cy=\"102\" r=\"3.2\" style=\"fill:var(--accent)\"/></svg>","caption":"도식 — 화자가 말한 ‘코스피 고점(6월 19일) 이후 6개월가량 조정’과 오늘 양봉, 위에 남아 있는 20·60·120일선을 방향만 옮겨 그린 개념도입니다. 실제 지수 값이 아닙니다."},{"type":"ul","items":["**코스닥(+8%, 주간 +9.8%)의 강점**: 코스닥은 708포인트로 마감했는데, 신용잔고가 **2025년 1월 이후 약 2년 내 최저치**까지 줄어들어 악성 매물이 싹 정리된 클린한 지수입니다. 내년 1월 중순쯤 주요 이평선들이 내려와 만나는 지점에서 추가 돌파 시 CTA 추종 매수와 쇼트커버가 붙을 여지도 있습니다.","**원/달러 환율**: 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 자리라, 다음 주에도 검은선 위에서 버틴다면 기술적으로 다시 위쪽 방향을 볼 수 있는 흐름입니다.","**연휴 장세와 크리스마스 경고**: 어제·오늘은 미국 추수감사절 연휴라 양놈 형님들이 안 계신 가벼운 장이었습니다. 월요일(11월 30일) 11월 마지막 영업일에 형님들이 돌아와서 \"어? 많이 올랐네\" 하고 두들겨 팰 수도 있으니 들뜨지 마세요. 크리스마스 연휴(12월 FOMC 이후 12일경부터)엔 플레이어가 아예 사라지므로 **12월 둘째 주까지 적정 수익을 내고 올해 매매를 정리**하는 걸 목표로 삼으시길 권합니다."]},{"type":"svg","title":"원/달러 — 5일선이 60일선에 붙고, 다음 주 20일선이 만나는 자리","svg":"<svg viewBox=\"0 0 340 150\" role=\"img\" aria-label=\"원달러 이동평균선 수렴 개념도\"><circle cx=\"28\" cy=\"16\" r=\"3\" style=\"fill:var(--tone-amber)\"/><text x=\"36\" y=\"19\" style=\"fill:var(--text-sub)\">20일선</text><circle cx=\"104\" cy=\"16\" r=\"3\" style=\"fill:var(--tone-blue)\"/><text x=\"112\" y=\"19\" style=\"fill:var(--text-sub)\">5일선</text><circle cx=\"176\" cy=\"16\" r=\"3\" style=\"fill:var(--tone-green)\"/><text x=\"184\" y=\"19\" style=\"fill:var(--text-sub)\">60일선</text><line x1=\"22\" y1=\"132\" x2=\"332\" y2=\"132\" style=\"stroke:var(--border-strong);stroke-width:1\"/><line x1=\"22\" y1=\"104\" x2=\"332\" y2=\"104\" style=\"stroke:var(--tone-green);stroke-width:1.6;opacity:.9\"/><path d=\"M22 48 C 92 54, 170 80, 236 92 S 300 101, 330 104\" style=\"fill:none;stroke:var(--tone-amber);stroke-width:1.8\"/><polyline points=\"22,100 38,92 54,108 70,96 86,110 102,99 118,112 134,101 150,109 166,96 182,106 198,98 214,110 230,101 246,107 262,97 278,105 294,99 310,106 330,102\" style=\"fill:none;stroke:var(--tone-blue);stroke-width:1.9;stroke-linejoin:round\"/><circle cx=\"330\" cy=\"104\" r=\"3.2\" style=\"fill:none;stroke:var(--tone-amber);stroke-width:1.5\"/><line x1=\"292\" y1=\"34\" x2=\"292\" y2=\"124\" style=\"stroke:var(--text-faint);stroke-width:1;stroke-dasharray:3 4;opacity:.55\"/><text x=\"292\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--text-faint)\">지금</text><text x=\"332\" y=\"124\" text-anchor=\"end\" style=\"fill:var(--tone-amber);font-weight:700\">다음 주 20·60일선 교차</text></svg>","caption":"도식 — 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 흐름을 화자 설명대로 그린 개념도입니다. 실제 환율 값이 아닙니다."},{"type":"levels","title":"코스닥 — 650 분할 매수에서 708 종가까지","unit":"p","levels":[{"price":708,"label":"오늘 종가 (+8%, 주간 +9.8%)","tone":"accent"},{"price":669,"label":"666 돌파 확인 후 매수 (실제 체결 669)","tone":"blue"},{"price":650,"label":"1차 분할 매수 구간","tone":"violet"}]},{"type":"flow","title":"코스닥 단타에서 연말 정리까지","steps":[{"label":"650 부근 1차 분할 매수","note":"조금씩 담는 구간"},{"label":"666 돌파 확인 후 진입","note":"실제 체결은 669"},{"label":"코스닥 150 추종 ETF 매수"},{"label":"+6~7% 급등에 일부 차익 실현","note":"잠 잘 자고 주말 편히 놀기"},{"label":"12월 둘째 주까지 수익 정리","note":"11/30 형님들 복귀·크리스마스 연휴 앞두고"}]},{"type":"h","text":"반도체 쏠림의 함정과 52주 신고가·매크로 지표"},{"type":"p","text":"주간으로 삼성전자·하이닉스가 약했던 건 외국인이 개별 기업이 싫어서가 아니라 아시아와 AI 반도체를 묶어서 팔고 있기 때문입니다. 우리나라는 패시브·액티브·가치주·배당주 펀드까지 전부 삼성전자 비중을 의무적으로 채워야 하는 구조라 다양성이 없고, 배당 세제 변화 같은 이슈로 펀드가 깨지면 삼성전자 매물이 쏟아지는 취약점이 있습니다."},{"type":"compare","title":"반도체 본진 vs 코스닥 150 ETF — 무엇을 어떻게","cols":[{"title":"반도체 본진","badge":"삼성전자 · SK하이닉스","points":["진짜 큰돈은 본진이 다시 돌아설 때 — 돌아서지 않으면 지수 전체가 몇 달 더 횡보","외국인이 개별 기업이 싫어서가 아니라 아시아·AI 반도체를 묶어서 팔고 있는 중","패시브·액티브·가치주·배당주 펀드까지 삼성전자 비중을 의무적으로 채우는 구조 — 배당 세제 이슈로 펀드가 깨지면 매물이 쏟아지는 취약점","차트상 매수 매력은 아직 — 현대차도 20일선에 간신히 붙은 정도, APR은 실적 탄탄·다음 주 양봉 시 위쪽 여력"]},{"title":"코스닥 150 ETF 단타","badge":"650 → 708","points":["650 부근 분할 매수 → 666 돌파 확인 후 진입(실제 체결 669)","오늘 6~7% 급등에 일부 차익 실현","신용잔고가 2025년 1월 이후 약 2년 내 최저 — 악성 매물 정리된 클린한 지수","내년 1월 중순 이평선 수렴 뒤 돌파 시 CTA 추종 매수·쇼트커버 여지","가볍게 먹고 빠져 자신감·수익을 쌓는 용도 — 일가를 이룰 곳은 아님"]}]},{"type":"table","title":"이번 주 52주 신고가 종목","headers":["종목","시장","신고가 배경"],"rows":[["한진칼","코스피","경영권 분쟁 · 월간 +105%"],["코스맥스","코스피","—"],["한미사이언스","코스피","—"],["펌텍코리아","코스닥","화장품 용기 테마"],["안랩","코스닥","정치 테마"]]},{"type":"p","text":"시총 상위주가 막힐 때 로봇·화장품 같은 지엽적 테마가 도는 건 전체 장이 아직 강하지 않다는 방증이기도 합니다."},{"type":"p","text":"미국 3분기 GDP가 **4.3%**, 근원 PCE가 **3.3%**로 나오면서 명목상 약 7%대 상승 압력이 확인됐고 12월 금리 인상 우려가 커졌습니다. 시중에 \"현금을 두면 돈이 녹으니 무조건 투자해야 한다\"는 말이 돌지만, 잘못 투자하면 녹는 게 아니라 **그냥 타서 사라진다**는 점도 기억하셔야 합니다."},{"type":"h","text":"글로벌 빅테크·AI 인프라 점검: 엔비디아·마이크론·인텔"},{"type":"p","text":"가격 지표를 여러 개 같이 보다 보면 먼저 방향을 틀기 시작하는 녀석들이 보입니다. 지금 원/달러, 코스닥, 금리(한 달 전 전환), 원유(15~20일 전 전환)가 변화를 보여주고 있어 시장 전체의 변곡점이 가까워지고 있는 건 맞지만, 대형 기술주 차트는 아직 갈 길이 멉니다."},{"type":"ul","items":["**삼성전자·하이닉스·현대차**: 삼성전자와 하이닉스가 돌아서지 않으면 지수 전체가 몇 달 더 횡보할 수 있습니다. 현대차도 20일선에 간신히 붙었지만 차트상 매수할 매력은 아직 안 보입니다. 반면 **APR**은 실적은 탄탄한데 수급·환율 이슈로 눌려 있던 거라 다음 주 양봉이 서면 위쪽 여력이 있습니다.","**미국 AI 반도체 vs 하이퍼스케일러**: **엔비디아**와 **마이크론 테크놀로지**, 일본 **키옥시아**, **소프트뱅크 그룹**은 하락 가속도가 붙거나 악성 매물이 많아 당분간 어렵습니다. 차라리 미국장에 가실 거면 **구글이나 메타 같은 하이퍼스케일러** 쪽이 낫습니다. **인텔**은 정부 지원금을 넣기 직전 자리까지 밀려나며 상업적 경쟁력 한계가 드러났습니다."]},{"type":"h","text":"디지털 불멸, 젠슨 황의 복귀, 그리고 마가(MAGA) 진영의 균열"},{"type":"p","text":"오늘은 주식 차트 너머의 미국 정치 지형 변화를 말씀드리고 싶습니다. 최근 일론 머스크가 아이들을 데리고 젠슨 황을 찾아가 사진을 찍었는데, 불과 며칠 전(11월 18~19일) 머스크는 뉴욕타임스 딜북 서밋과 CNBC 인터뷰에서 **\"나는 MAGA가 아니다(I'm not sure what MAGA is)\"**라며 공화당 후원을 후회하는 듯한 발언을 했습니다. 뭔가 불안감을 느낀 두 사람이 동지애로 뭉친 모양새입니다."},{"type":"ul","items":["**남침례회와 '브랜트우드 선언'**: 미국 최대 단일 개신교 교단인 남침례회(등록 교인 1,233만 명)는 **'브랜트우드 선언(Brentwood Declaration)'**을 통해 AI로 고인을 모방하거나 인간과 기계의 경계를 모호하게 만드는 디지털 불멸 기술에 선을 그었습니다. 이들은 MAGA와 트럼프의 핵심 지지 기반이지만, 본질적으로 AI 만능주의나 세속적 도덕 해이와는 충돌할 수밖에 없습니다.","**젠슨 황 복귀가 건드린 역린**: 젠슨 황의 초고속 복귀를 두고 세속 언론은 중국 관련 리스크를 따지지만, 보수 기독교 지지층은 트럼프가 불륜 및 윤리적 문제에 노골적인 면제부를 주는 모습에 큰 배신감과 괴리감을 느끼고 있습니다. 실제로 **악시오스(Axios)**에서도 젠슨 황 복귀를 계기로 MAGA 진영이 분열되고 있다는 보도가 나왔습니다."]},{"type":"h","text":"드라마 〈홈랜드〉로 본 미국의 균열과 한국 증시의 상대적 기회"},{"type":"p","text":"중요한 건 팩트가 아니라 대중의 머릿속에 어떤 이미지가 자리 잡느냐입니다. 마리 앙투아네트가 \"빵이 없으면 케이크(고기)를 먹으면 되지\"라고 실제로 말했는지는 불분명하지만 대중의 증오를 샀듯, 미국 드라마 **〈홈랜드(Homeland)〉 시즌 1 에피소드 11**에서도 테러 위험 속 벙커에 격리된 부통령이 \"사우디아라비아는 건드리지 말고 아무나 한 명 잘라\"라고 지시하는 모습이 그려집니다. 미국 남부 보수층이 혐오하던 '딥스테이트'의 전형을 이제는 **트럼프 본인이 닮아가고 있다**는 인식이 MAGA 내부에 퍼지고 있습니다."},{"type":"callout","text":"트럼프가 공화당 내 레임덕에 빠져 집단지도체제(J.D. 밴스 등)로 빠르게 넘어가면 불확실성이 줄어 증시에 호재겠지만, 그립을 놓지 않으려 버티면 향후 6개월간 미국 정치발 혼란이 이어질 수 있습니다. 오히려 스타게이트 등 트럼프 관련 사업들이 정리되면서 **당분간 미국장보다 먼저 빠진 한국장이 상대적으로 나을 수도 있다**는 게 제 생각입니다."},{"type":"p","text":"오늘 낮에 KB증권 **이은택 연구원**과 만나 대중 앞에서 이야기하는 고충에 대해 대화를 나눴는데, 결국 세상도 시장도 우리가 생각하는 것만큼 정교하거나 합리적이지 않습니다. 올해 역대급 상승장에서 아쉽게 수익을 못 내셨더라도 너무 자책하지 마시고 운이 조금 없었을 뿐이라 생각하시며, 다음 반등 타이밍을 저와 함께 차분히 노려보시죠. 금요일 RTS 여기서 마치겠습니다. 감사합니다."}]}}};

  }
  function fmtNum(v) {
    var n = Number(v);
    if (!isFinite(n)) return String(v == null ? '' : v);
    var neg = n < 0;
    var parts = String(Math.abs(n)).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }
  function vizPrice(v) {
    var raw = String(v == null ? '' : v).trim();
    if (!raw) return '';
    var n = Number(raw.replace(/[,\s]/g, ''));
    return isFinite(n) ? fmtNum(n) : raw;
  }
  function notEmpty(list) {
    return (list || []).filter(function (x) { return x != null && String(x).trim() !== ''; });
  }

  /* ── 시각화 렌더러 (assets/app.js 방식 그대로) ───────────── */
  function vizShell(type, title) {
    var box = mk('div', 'viz viz-' + type);
    if (title) box.appendChild(mk('div', 'viz-title', rich(title)));
    return box;
  }

  function buildStats(b) {
    var box = vizShell('stats', b.title);
    var items = (b.items || []).filter(function (it) {
      return it && notEmpty([it.label, it.value, it.sub]).length;
    });
    if (!items.length) return box;
    var grid = mk('div', 'stats-grid');
    items.forEach(function (it) {
      var cell = mk('div', 'stat' + (it.tone ? ' tone-' + vizTone(it.tone) : ''));
      if (it.label) cell.appendChild(mk('div', 'stat-label', rich(it.label)));
      if (it.value != null && String(it.value).trim() !== '') cell.appendChild(mk('div', 'stat-value', rich(it.value)));
      if (it.sub) cell.appendChild(mk('div', 'stat-sub', rich(it.sub)));
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    return box;
  }

  function buildLevels(b) {
    var box = vizShell('levels', b.title);
    var levels = (b.levels || []).filter(function (lv) {
      return lv && notEmpty([lv.price, lv.label]).length;
    });
    if (!levels.length) return box;
    var nums = levels.map(function (lv) {
      var n = Number(String(lv.price == null ? '' : lv.price).replace(/[,\s]/g, ''));
      return isFinite(n) ? n : null;
    });
    var allNum = nums.every(function (n) { return n != null; });
    var ordered = levels.map(function (lv, i) { return { lv: lv, n: nums[i] }; });
    if (allNum) ordered.sort(function (a, c) { return c.n - a.n; });
    if (b.unit) {
      var un = mk('div', 'lv-unit');
      un.textContent = String(b.unit);
      box.appendChild(un);
    }
    var list = mk('div', 'lv-list');
    ordered.forEach(function (o) {
      var lv = o.lv;
      var row = mk('div', 'lv-row tone-' + vizTone(lv.tone));
      var tick = mk('span', 'lv-tick');
      tick.setAttribute('aria-hidden', 'true');
      row.appendChild(tick);
      row.appendChild(mk('span', 'lv-label', rich(String(lv.label || ''))));
      row.appendChild(mk('span', 'lv-price', rich(vizPrice(lv.price))));
      list.appendChild(row);
    });
    box.appendChild(list);
    return box;
  }

  function buildFlow(b) {
    var box = vizShell('flow', b.title);
    var wrap = mk('div', 'flow');
    var n = 0;
    (b.steps || []).forEach(function (st) {
      if (!st) return;
      var label = String(st.label == null ? '' : st.label).trim();
      var note = String(st.note == null ? '' : st.note).trim();
      if (!label && !note) return;
      if (n) {
        var ar = mk('span', 'flow-arrow');
        ar.setAttribute('aria-hidden', 'true');
        wrap.appendChild(ar);
      }
      n += 1;
      var step = mk('div', 'flow-step');
      var num = mk('span', 'flow-num');
      num.setAttribute('aria-hidden', 'true');
      num.textContent = String(n);
      step.appendChild(num);
      var body = mk('div', 'flow-body');
      if (label) body.appendChild(mk('div', 'flow-label', rich(label)));
      if (note) body.appendChild(mk('div', 'flow-note', rich(note)));
      step.appendChild(body);
      wrap.appendChild(step);
    });
    if (n) box.appendChild(wrap);
    return box;
  }

  function buildCompare(b) {
    var box = vizShell('compare', b.title);
    var grid = mk('div', 'cmp-grid');
    (b.cols || []).forEach(function (col) {
      if (!col) return;
      var c = mk('div', 'cmp-col');
      var head = mk('div', 'cg-head');
      head.appendChild(mk('span', 'cmp-title', rich(col.title || '')));
      if (col.badge) head.appendChild(mk('span', 'cmp-badge', rich(col.badge)));
      c.appendChild(head);
      var ul = mk('ul', 'cmp-points');
      (col.points || []).forEach(function (pt) {
        if (!String(pt == null ? '' : pt).trim()) return;
        ul.appendChild(mk('li', '', rich(pt)));
      });
      c.appendChild(ul);
      grid.appendChild(c);
    });
    box.appendChild(grid);
    return box;
  }

  function buildTable(b) {
    var box = vizShell('table', b.title);
    var headers = (b.headers || []).map(function (h) { return h == null ? '' : String(h); });
    var rows = (b.rows || []).filter(function (r) { return Array.isArray(r) && notEmpty(r).length; });
    if (!headers.length && !rows.length) return box;
    var wrap = mk('div', 'tbl-wrap');
    var table = mk('table', 'tbl');
    if (headers.length) {
      var thead = mk('thead');
      var hr = mk('tr');
      headers.forEach(function (h) {
        var th = mk('th', '', rich(h));
        th.setAttribute('scope', 'col');
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
    }
    if (rows.length) {
      var tbody = mk('tbody');
      var cols = Math.max(headers.length, 1);
      rows.forEach(function (r) { cols = Math.max(cols, r.length); });
      rows.forEach(function (r) {
        var tr = mk('tr');
        for (var i = 0; i < cols; i++) {
          var cell = document.createElement(i === 0 ? 'th' : 'td');
          if (i === 0) cell.setAttribute('scope', 'row');
          cell.innerHTML = rich(r[i] == null ? '' : String(r[i]));
          tr.appendChild(cell);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }
    wrap.appendChild(table);
    box.appendChild(wrap);
    return box;
  }

  /* 자유형 SVG — 화이트리스트 태그만 남기고 스크립트·이벤트·javascript: URL 제거 */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SVG_TAGS = {
    svg: 1, g: 1, defs: 1, title: 1, desc: 1, symbol: 1, use: 1,
    lineargradient: 1, radialgradient: 1, stop: 1, pattern: 1, clippath: 1, mask: 1, marker: 1,
    path: 1, rect: 1, circle: 1, ellipse: 1, line: 1, polyline: 1, polygon: 1,
    text: 1, tspan: 1, textpath: 1
  };
  var SVG_BAD_URL = /(javascript|vbscript|data)\s*:/i;

  function cleanSvgAttrs(el) {
    var attrs = [];
    for (var i = 0; i < el.attributes.length; i++) attrs.push(el.attributes[i]);
    attrs.forEach(function (a) {
      var name = String(a.name || '').toLowerCase();
      var val = String(a.value == null ? '' : a.value);
      var drop = false;
      if (name.indexOf('on') === 0) drop = true;
      else if (name === 'href' || name.slice(-5) === ':href') { if (!/^\s*#/.test(val)) drop = true; }
      if (!drop && (SVG_BAD_URL.test(val) || /expression\s*\(/i.test(val))) drop = true;
      if (drop) el.removeAttribute(a.name);
    });
  }
  function cleanSvgTree(node) {
    var children = [];
    for (var i = 0; i < node.childNodes.length; i++) children.push(node.childNodes[i]);
    children.forEach(function (ch) {
      if (ch.nodeType === 1) {
        var name = String(ch.nodeName || '').toLowerCase();
        if (name.indexOf(':') >= 0) name = name.split(':').pop();
        var ns = ch.namespaceURI;
        if (!SVG_TAGS[name] || (ns && ns !== SVG_NS)) { node.removeChild(ch); return; }
        cleanSvgAttrs(ch);
        cleanSvgTree(ch);
      } else if (ch.nodeType !== 3) {
        node.removeChild(ch);
      }
    });
  }
  function sanitizeSvg(src) {
    var txt = String(src == null ? '' : src).trim();
    if (!txt || !/^<svg[\s>]/i.test(txt)) return null;
    var doc = null;
    try { doc = new DOMParser().parseFromString(txt, 'image/svg+xml'); } catch (e) { return null; }
    if (!doc || !doc.documentElement || doc.querySelector('parsererror')) return null;
    var root = doc.documentElement;
    if (String(root.nodeName).toLowerCase() !== 'svg') return null;
    var w = parseFloat(root.getAttribute('width'));
    var hh = parseFloat(root.getAttribute('height'));
    cleanSvgAttrs(root);
    cleanSvgTree(root);
    root.removeAttribute('width');
    root.removeAttribute('height');
    if (!root.getAttribute('viewBox') && isFinite(w) && isFinite(hh) && w > 0 && hh > 0) {
      root.setAttribute('viewBox', '0 0 ' + w + ' ' + hh);
    }
    root.setAttribute('class', ((root.getAttribute('class') || '') + ' svg-canvas').trim());
    root.setAttribute('width', '100%');
    /* height 는 CSS(.svg-holder svg{height:auto})가 잡는다 — height="auto" 속성은 표준에 없어 콘솔 오류를 낸다 */
    root.setAttribute('focusable', 'false');
    if (!root.getAttribute('role')) root.setAttribute('role', 'img');
    return new XMLSerializer().serializeToString(root);
  }
  function buildSvg(b) {
    var box = vizShell('svg', b.title);
    var markup = sanitizeSvg(b.svg);
    if (markup) {
      var holder = mk('div', 'svg-holder');
      holder.innerHTML = markup;
      if (holder.querySelector('svg')) box.appendChild(holder);
    }
    if (b.caption) box.appendChild(mk('div', 'svg-caption', rich(String(b.caption))));
    return box;
  }

  /* ── 본문 블록 ─────────────────────────────────────── */
  var VIZ_KEYS = { stats: 1, levels: 1, flow: 1, compare: 1, table: 1, svg: 1, bars: 1, donut: 1, timeline: 1 };

  function blockEl(b) {
    if (!b) return null;
    if (b.type === 'h') return mk('div', 'section-title', rich(b.text || ''));
    if (b.type === 'ul' || b.type === 'ol') {
      var list = mk(b.type === 'ol' ? 'ol' : 'ul', 'bullets');
      (b.items || []).forEach(function (it) {
        var li = mk('li', '', rich(it));
        list.appendChild(li);
      });
      return list;
    }
    if (b.type === 'callout') {
      var co = mk('div', 'callout');
      var qm = mk('span', 'callout-q');
      qm.setAttribute('aria-hidden', 'true');
      qm.textContent = '\u201C';
      co.appendChild(qm);
      co.appendChild(mk('div', 'callout-txt', rich(b.text || '')));
      return co;
    }
    if (b.type === 'stats') return buildStats(b);
    if (b.type === 'levels') return buildLevels(b);
    if (b.type === 'flow') return buildFlow(b);
    if (b.type === 'compare') return buildCompare(b);
    if (b.type === 'table') return buildTable(b);
    if (b.type === 'svg') return buildSvg(b);
    var frag = document.createDocumentFragment();
    splitParagraph(b.text || '').forEach(function (chunk) {
      frag.appendChild(mk('p', '', rich(chunk)));
    });
    return frag;
  }

  /* ── 버전 요약 수치 ────────────────────────────────── */
  function collectText(blocks) {
    var out = [];
    blocks.forEach(function (b) {
      if (!b) return;
      if (b.text) out.push(b.text);
      if (b.title) out.push(b.title);
      if (b.caption) out.push(b.caption);
      (b.items || []).forEach(function (it) {
        if (typeof it === 'string') out.push(it);
        else if (it) out.push([it.label, it.value, it.sub].filter(Boolean).join(' '));
      });
      (b.steps || []).forEach(function (st) { if (st) out.push([st.label, st.note].filter(Boolean).join(' ')); });
      (b.cols || []).forEach(function (c) {
        if (!c) return;
        out.push([c.title, c.badge].filter(Boolean).join(' '));
        (c.points || []).forEach(function (pt) { out.push(String(pt)); });
      });
      (b.rows || []).forEach(function (r) { (r || []).forEach(function (c) { out.push(String(c)); }); });
      (b.levels || []).forEach(function (lv) { if (lv) out.push(String(lv.label || '')); });
    });
    return out.join(' ');
  }
  function metrics(v) {
    var blocks = v.blocks;
    var marks = (collectText(blocks).match(/\*\*[^*]+\*\*/g) || []).length;
    var boxes = blocks.filter(function (b) { return b && (b.type === 'callout' || b.type === 'ul' || b.type === 'ol'); }).length;
    var vizs = blocks.filter(function (b) { return b && VIZ_KEYS[b.type]; }).length;
    return { marks: marks, boxes: boxes, vizs: vizs };
  }

  /* ── 테마 ──────────────────────────────────────────── */
  var themeBtn = document.getElementById('themeBtn');
  var themeLbl = document.getElementById('themeLbl');
  var themeSvg = document.getElementById('themeSvg');
  function paintThemeBtn() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeLbl.textContent = dark ? '라이트' : '다크';
    themeSvg.innerHTML = dark
      ? '<circle cx="10" cy="10" r="3.6"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M15.3 4.7 14 6M6 14l-1.3 1.3"/>'
      : '<path d="M15.8 12.6A6.5 6.5 0 0 1 7.4 4.2a6.5 6.5 0 1 0 8.4 8.4Z"/>';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('yts.theme', next); } catch (e) {}
    paintThemeBtn();
  });
  paintThemeBtn();

  /* ── 헤더 정보 ─────────────────────────────────────── */
  document.getElementById('cmpTitle').textContent = META.title;
  document.getElementById('cmpVideoTitle').textContent = META.title;
  document.getElementById('cmpVideoTitle').href = META.url;
  document.getElementById('cmpChannel').textContent = META.channel;
  document.getElementById('cmpChannel').href = META.channelUrl;
  document.getElementById('cmpChLink').href = META.channelUrl;
  document.getElementById('cmpCat').textContent = META.categoryLabel;
  document.getElementById('cmpCat').className = 'cat-tag cat-' + (META.category || 'etc');
  var av = document.getElementById('cmpAvatar');
  var avImg = new Image();
  avImg.alt = META.channel;
  avImg.referrerPolicy = 'no-referrer';
  avImg.onload = function () { av.textContent = ''; av.appendChild(avImg); };
  avImg.src = META.avatar;
  var thumb = document.getElementById('cmpThumb');
  thumb.alt = META.title + ' 썸네일';
  thumb.src = 'https://i.ytimg.com/vi/' + META.videoId + '/mqdefault.jpg';
  document.getElementById('cmpThumbLink').href = META.url;

  (function () {
    var d = new Date(META.publishedAt);
    if (isNaN(d.getTime())) return;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('cmpPub').textContent = (d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()));
    var diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
    var rel = diffMin < 60 ? (diffMin < 1 ? '방금 전' : diffMin + '분 전')
      : diffMin < 1440 ? Math.floor(diffMin / 60) + '시간 전'
      : diffMin < 10080 ? Math.floor(diffMin / 1440) + '일 전'
      : Math.floor(diffMin / 43200) + '개월 전';
    document.getElementById('cmpRel').textContent = rel;
  })();

  /* ── 탭 렌더 ───────────────────────────────────────── */
  var body = document.getElementById('cmpBody');
  var note = document.getElementById('cmpNote');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.cg-tab'));

  ['a', 'b', 'c'].forEach(function (k) {
    var m = metrics(VERSIONS[k]);
    var el = document.querySelector('.cg-tab-m[data-meta="' + k + '"]');
    el.textContent = '시각화 ' + m.vizs + ' · 박스 ' + m.boxes + ' · 형광펜 ' + m.marks;
  });

  function setVersion(v, opts) {
    if (!VERSIONS[v]) v = 'a';
    state.v = v;
    var ver = VERSIONS[v];
    body.innerHTML = '';
    var frag = document.createDocumentFragment();
    ver.blocks.forEach(function (b) {
      var el = blockEl(b);
      if (el) frag.appendChild(el);
    });
    body.appendChild(frag);
    tabs.forEach(function (t) {
      t.setAttribute('aria-selected', t.dataset.v === v ? 'true' : 'false');
      t.tabIndex = t.dataset.v === v ? 0 : -1;
    });
    note.innerHTML = '<span class="cg-note-k">' + ver.key + '안</span> ' + rich(ver.diff) +
      ' <span class="cg-note-hint">탭을 눌러 바로 바꿔 보기</span>';
    try { localStorage.setItem('cmp.alsangmu.version', v); } catch (e) {}
    if (!opts || !opts.keepHash) {
      if (history.replaceState) history.replaceState(null, '', '#' + v);
    }
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { setVersion(t.dataset.v); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var order = ['a', 'b', 'c'];
      var i = order.indexOf(state.v) + (e.key === 'ArrowRight' ? 1 : -1);
      if (i < 0) i = 2; if (i > 2) i = 0;
      setVersion(order[i]);
    }
  });

  var initial = (location.hash || '').replace('#', '').toLowerCase();
  if (!VERSIONS[initial]) { try { initial = localStorage.getItem('cmp.alsangmu.version') || 'a'; } catch (e) { initial = 'a'; } }
  setVersion(VERSIONS[initial] ? initial : 'a');
})();
</script>
</body>
</html>
