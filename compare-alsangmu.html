<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
<title>알상무 요약 A/B/C 비교 — 피클 유튜브 요약</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/style.css?v=20261128v" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('yts.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
<style>
  /* 비교 페이지 전용 크롬 — 카드 본문은 사이트 style.css 그대로 */
  .cg-wrap { max-width: 820px; margin: 0 auto; padding: 6px 8px 72px; }

  .cg-head {
    display: flex; align-items: center; gap: 12px;
    margin: 2px 0 10px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: var(--shadow-card);
  }
  .cg-thumb-link { flex: 0 0 84px; display: block; line-height: 0; border-radius: 10px; }
  .cg-thumb {
    width: 84px; height: 48px;
    border-radius: 10px; object-fit: cover; background: var(--surface-3);
    border: 1px solid var(--border);
  }
  .cg-head-txt { flex: 1 1 auto; min-width: 0; }
  .cg-kicker {
    font-size: 10.5px; font-weight: 800; letter-spacing: -0.1px;
    color: var(--accent-strong); margin-bottom: 3px;
  }
  [data-theme="dark"] .cg-kicker { color: var(--accent); }
  .cg-title {
    margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;
    letter-spacing: -0.35px; color: var(--text); word-break: keep-all;
    white-space: normal; overflow: visible; text-overflow: clip;
  }
  .cg-sub {
    margin-top: 3px; font-size: 11.5px; line-height: 1.5;
    color: var(--text-faint); word-break: keep-all;
  }
  .cg-sub b { color: var(--text-sub); font-weight: 700; }
  .cg-sub a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
  [data-theme="dark"] .cg-sub a { color: var(--accent); }
  .cg-head .btn { flex: 0 0 auto; }

  /* A/B/C 전환 탭 — 스크롤해도 상단 고정 */
  .cg-tabs {
    position: sticky; top: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
    margin: 0 0 8px; padding: 8px 0;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    backdrop-filter: blur(14px) saturate(1.15);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  }
  .cg-tab {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    min-width: 0; padding: 8px 10px 9px;
    border: 1px solid var(--border); border-radius: 13px;
    background: var(--surface); color: var(--text-sub);
    font-family: inherit; text-align: left; cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .cg-tab:hover { border-color: var(--border-strong); }
  .cg-tab:active { transform: scale(0.985); }
  .cg-tab[aria-selected="true"] {
    border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .cg-tab-k {
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--accent-strong); line-height: 1.2;
  }
  [data-theme="dark"] .cg-tab-k { color: var(--accent); }
  .cg-tab-t {
    font-size: 13px; font-weight: 800; letter-spacing: -0.25px;
    color: var(--text-sub); line-height: 1.35; word-break: keep-all;
  }
  .cg-tab[aria-selected="true"] .cg-tab-t { color: var(--text); }
  .cg-tab-m {
    font-size: 10px; line-height: 1.35; color: var(--text-faint);
    font-variant-numeric: tabular-nums; white-space: normal;
    max-width: 100%;
  }
  .cg-tab-m b { color: var(--text-sub); font-weight: 800; }

  .cg-note {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px;
    margin: 0 0 12px; font-size: 12px; line-height: 1.55;
    color: var(--text-sub); word-break: keep-all;
  }
  .cg-note-k {
    display: inline-flex; align-items: center; height: 19px; padding: 0 8px;
    border-radius: 999px; background: var(--accent-soft);
    color: var(--accent-strong); font-size: 10.5px; font-weight: 800;
  }
  [data-theme="dark"] .cg-note-k { color: var(--accent); }
  .cg-note-hint { color: var(--text-faint); }

  .cg-card-foot {
    padding: 12px 18px 15px; border-top: 1px solid var(--border);
    background: var(--surface-2); font-size: 11.5px; line-height: 1.6;
    color: var(--text-faint); word-break: keep-all;
  }
  .cg-card-foot a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
  [data-theme="dark"] .cg-card-foot a { color: var(--accent); }

  /* A안 — 박스·시각화 없이 글만: 문단 호흡만 조금 넉넉하게 */
  #cmpBody.v-a p { line-height: 1.94; }

  @media (max-width: 430px) {
    .cg-head { padding: 10px 12px; gap: 10px; }
    .cg-thumb-link { flex-basis: 68px; }
    .cg-thumb { width: 68px; height: 39px; }
    .cg-title { font-size: 14px; }
    .cg-tab { padding: 7px 8px 8px; }
    .cg-tab-t { font-size: 12px; }
    .cg-tab-m { font-size: 9.5px; }
  }
  @media (max-width: 360px) {
    .cg-tab-m { display: none; }
  }

  /* ══ 5차 · B안 구조 분리 (나열·대립·종속) ═════════════════ */
  #cmpBody.v-b p { line-height: 1.9; }

  .v-b .struct { margin: 16px 0 1.15em; }
  .v-b .st-tag {
    display: flex; align-items: center; gap: 5px;
    margin: 0 0 6px;
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; line-height: 1.2;
    color: var(--text-faint);
  }
  .v-b .st-tag-ar { font-size: 11px; letter-spacing: 0; }

  /* 나열 — 연한 회색 박스 */
  .v-b .st-list {
    padding: 11px 14px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 13px;
  }
  .v-b .st-list .st-tag { margin-bottom: 7px; }
  .v-b .st-items { margin: 0; padding: 0; list-style: none; }
  .v-b .st-items li {
    position: relative;
    margin: 0 0 9px; padding-left: 15px;
    line-height: 1.85; word-break: keep-all; overflow-wrap: break-word;
  }
  .v-b .st-items li:last-child { margin-bottom: 0; }
  .v-b .st-items li::before {
    content: ""; position: absolute; left: 2px; top: 0.82em;
    width: 5px; height: 5px; border-radius: 50%;
    background: color-mix(in srgb, var(--text-faint) 72%, transparent);
  }

  /* 대립 — 좌우 2열 (모바일은 상하 + 얇은 연결선) */
  .v-b .st-pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
    align-items: stretch;
  }
  .v-b .st-col {
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .v-b .st-col-txt { line-height: 1.84; word-break: keep-all; overflow-wrap: break-word; }
  .v-b .st-mid { position: relative; display: flex; align-items: center; justify-content: center; }
  .v-b .st-vs {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface-3); color: var(--text-sub);
    font-size: 10px; font-weight: 800; line-height: 1;
  }
  @media (max-width: 559px) {
    .v-b .st-pair { grid-template-columns: minmax(0, 1fr); }
    .v-b .st-mid { height: 30px; }
    .v-b .st-mid::before, .v-b .st-mid::after {
      content: ""; position: absolute; left: 50%;
      width: 1px; height: 10px; margin-left: -0.5px;
      background: var(--border-strong);
    }
    .v-b .st-mid::before { top: 0; }
    .v-b .st-mid::after { bottom: 0; }
  }

  /* 종속 — 왼쪽 얇은 세로선 + 살짝 들여쓰기 */
  .v-b .st-sub {
    margin: -0.3em 0 1.1em; padding: 1px 0 1px 13px;
    border-left: 2px solid color-mix(in srgb, var(--text-faint) 42%, transparent);
  }
  .v-b .st-sub .st-tag { margin-bottom: 3px; }
  .v-b .st-sub .st-txt { font-size: 15px; line-height: 1.86; word-break: keep-all; overflow-wrap: break-word; }

  /* ══ 4차 · C안 인포그래픽 ═════════════════════════════════ */
  .ig-map {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;
  }
  @media (min-width: 560px) {
    .ig-map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .ig-map-c {
    display: flex; gap: 8px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  }
  .ig-map-n {
    flex: 0 0 auto; font-size: 14px; font-weight: 800; line-height: 1.35;
    color: var(--accent-strong);
  }
  .ig-map-c.tone-red .ig-map-n { color: var(--tone-red); }
  .ig-map-c.tone-blue .ig-map-n { color: var(--tone-blue); }
  .ig-map-c.tone-amber .ig-map-n { color: var(--tone-amber); }
  .ig-map-c.tone-green .ig-map-n { color: var(--tone-green); }
  .ig-map-c.tone-violet .ig-map-n { color: var(--tone-violet); }
  .ig-map-b { flex: 1 1 auto; min-width: 0; }
  .ig-map-t { font-size: 11.5px; font-weight: 800; line-height: 1.35; color: var(--text); word-break: keep-all; }
  .ig-map-d { margin-top: 2px; font-size: 10.5px; line-height: 1.45; color: var(--text-faint); word-break: keep-all; }

  .ig-vs {
    display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
    align-items: stretch; gap: 4px;
  }
  .ig-vs-col {
    padding: 10px 11px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface);
  }
  .ig-vs-col.is-a { border-color: color-mix(in srgb, var(--accent) 34%, var(--border)); }
  .ig-vs-col.is-r { border-color: color-mix(in srgb, var(--tone-blue) 34%, var(--border)); }
  .ig-vs-h { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 7px; }
  .ig-vs-t { font-size: 12.5px; font-weight: 800; line-height: 1.35; color: var(--text); word-break: keep-all; }
  .ig-vs-b {
    font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px;
    background: var(--surface-3); color: var(--text-sub); white-space: nowrap;
  }
  .ig-vs ul { margin: 0; padding-left: 13px; }
  .ig-vs li { margin-bottom: 3px; font-size: 11.5px; line-height: 1.55; color: var(--text-sub); word-break: keep-all; }
  .ig-vs li:last-child { margin-bottom: 0; }
  .ig-vs-mid { display: flex; align-items: center; justify-content: center; }
  .ig-vs-mid span {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface-3); color: var(--text-sub);
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em;
  }
  @media (max-width: 540px) {
    .ig-vs { grid-template-columns: minmax(0, 1fr); }
    .ig-vs-mid { padding: 1px 0; }
  }

  .ig-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 559px) {
    .ig-cards .ig-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }
  @media (min-width: 560px) {
    .ig-cards { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  .ig-card {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 11px;
    background: var(--surface);
  }
  .ig-card-t { font-size: 12.5px; font-weight: 800; line-height: 1.35; color: var(--text); word-break: keep-all; }
  .ig-card.tone-red .ig-card-t { color: var(--tone-red); }
  .ig-card-g { margin-top: 1px; font-size: 9.5px; font-weight: 700; color: var(--text-faint); }
  .ig-card-n { margin-top: 4px; font-size: 10.5px; line-height: 1.45; color: var(--text-sub); word-break: keep-all; }

  .ig-sig { display: flex; flex-direction: column; gap: 6px; }
  .ig-sig-row {
    display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 9px;
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 11px;
    background: var(--surface);
  }
  .ig-sig-dot { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; }
  .is-bad .ig-sig-dot { background: var(--tone-red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone-red) 16%, transparent); }
  .is-warn .ig-sig-dot { background: var(--tone-amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone-amber) 16%, transparent); }
  .is-good .ig-sig-dot { background: var(--tone-green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone-green) 16%, transparent); }
  .ig-sig-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .ig-sig-n { font-size: 12.5px; font-weight: 800; line-height: 1.4; color: var(--text); word-break: keep-all; }
  .ig-sig-b {
    font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px;
    background: var(--surface-3); white-space: nowrap;
  }
  .is-bad .ig-sig-b { color: var(--tone-red); }
  .is-warn .ig-sig-b { color: var(--tone-amber); }
  .is-good .ig-sig-b { color: var(--tone-green); }
  .ig-sig-note { margin-top: 3px; font-size: 11px; line-height: 1.5; color: var(--text-sub); word-break: keep-all; }

  .viz-kpi .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .viz-kpi .stat-value { font-size: 21px; letter-spacing: -0.03em; }

  /* C안 SVG 공통 — 라이트/다크 모두 CSS 변수로 */
  .viz-svg .svg-holder svg { max-width: 460px; margin: 0 auto; }
  .ig text { font-family: inherit; }
  .ig .t1 { font-size: 11px; font-weight: 800; fill: var(--text); }
  .ig .t2 { font-size: 10px; fill: var(--text-sub); }
  .ig .t3 { font-size: 9.5px; fill: var(--text-faint); }
  .ig .ax { font-size: 9px; fill: var(--text-faint); }
  .ig .n1 { font-size: 13px; font-weight: 800; fill: var(--text); }
  .ig .box { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .ig .box2 { fill: var(--surface-2); stroke: var(--border); stroke-width: 1; }
  .ig .axis { stroke: var(--border-strong); stroke-width: 1.4; fill: none; }
  .ig .tick { stroke: color-mix(in srgb, var(--border-strong) 75%, transparent); stroke-width: 1; }
  .ig .grid { stroke: color-mix(in srgb, var(--border) 85%, transparent); stroke-width: 1; }
  .ig .arw { stroke: var(--border-strong); stroke-width: 1.3; fill: none; }
  .ig .ar { fill: var(--border-strong); }
  .ig .dash { stroke: var(--tone-amber); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .ig .zap { stroke: var(--tone-red); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
  .ig .dot-ac { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .ig .dot-a { fill: var(--tone-amber); stroke: var(--surface); stroke-width: 2; }
  .ig .dot-v { fill: var(--tone-violet); stroke: var(--surface); stroke-width: 2; }
  .ig .dot-g { fill: var(--tone-green); stroke: var(--surface); stroke-width: 2; }
  .ig .sf-g { fill: color-mix(in srgb, var(--tone-green) 13%, transparent); }
  .ig .sf-a { fill: color-mix(in srgb, var(--tone-amber) 15%, transparent); }
  .ig .sf-r { fill: color-mix(in srgb, var(--tone-red) 12%, transparent); }
  .ig .bf-b { fill: color-mix(in srgb, var(--tone-blue) 24%, transparent); stroke: var(--tone-blue); stroke-width: 1; }
  .ig .bf-a { fill: color-mix(in srgb, var(--tone-amber) 28%, transparent); stroke: var(--tone-amber); stroke-width: 1; }
  .ig .bf-r { fill: color-mix(in srgb, var(--tone-red) 24%, transparent); stroke: var(--tone-red); stroke-width: 1; }
  .ig .c-g { fill: var(--tone-green); }
  .ig .c-r { fill: var(--tone-red); }
  .ig .c-a { fill: var(--tone-amber); }
  .ig .c-b { fill: var(--tone-blue); }
  .ig .c-v { fill: var(--tone-violet); }
  .ig .c-ac { fill: var(--accent-strong); }
  [data-theme="dark"] .ig .c-ac { fill: var(--accent); }
</style>
</head>
<body>
<div class="cg-wrap">

  <header class="cg-head">
    <a class="cg-thumb-link" id="cmpThumbLink" href="#" target="_blank" rel="noopener">
      <img class="cg-thumb" id="cmpThumb" alt="" width="84" height="48" decoding="async" referrerpolicy="no-referrer" />
    </a>
    <div class="cg-head-txt">
      <div class="cg-kicker">🧪 요약 스타일 실험 · 피드백 반영 5차 · A/B/C 신구도</div>
      <h1 class="cg-title" id="cmpTitle">알상무 R's Trading Station (11월 27일 금) 풀버젼</h1>
      <div class="cg-sub">A/B/C는 <b>같은 방송·같은 팩트</b>를 다르게 담은 3버전입니다</div>
    </div>
    <button class="btn" id="themeBtn" type="button" title="테마 전환">
      <svg class="btn-svg" id="themeSvg" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.8 12.6A6.5 6.5 0 0 1 7.4 4.2a6.5 6.5 0 1 0 8.4 8.4Z"/></svg>
      <span class="btn-lbl" id="themeLbl">다크</span>
    </button>
  </header>

  <nav class="cg-tabs" role="tablist" aria-label="요약 버전 선택">
    <button class="cg-tab" type="button" role="tab" id="tab-a" data-v="a" aria-selected="false" aria-controls="cmpBody">
      <span class="cg-tab-k">A안</span>
      <span class="cg-tab-t">순수 텍스트</span>
      <span class="cg-tab-m" data-meta="a"></span>
    </button>
    <button class="cg-tab" type="button" role="tab" id="tab-b" data-v="b" aria-selected="false" aria-controls="cmpBody">
      <span class="cg-tab-k">B안</span>
      <span class="cg-tab-t">구조 분리</span>
      <span class="cg-tab-m" data-meta="b"></span>
    </button>
    <button class="cg-tab" type="button" role="tab" id="tab-c" data-v="c" aria-selected="false" aria-controls="cmpBody">
      <span class="cg-tab-k">C안</span>
      <span class="cg-tab-t">시각화 몰빵</span>
      <span class="cg-tab-m" data-meta="c"></span>
    </button>
  </nav>

  <div class="cg-note" id="cmpNote" role="tabpanel" aria-live="polite"></div>

  <article class="card no-thumb" id="cmpCard">
    <div class="card-header">
      <div class="yt-info">
        <div class="yt-head-row">
          <a class="ch-av-link" id="cmpChLink" href="#" target="_blank" rel="noopener">
            <span class="ch-av" id="cmpAvatar">알</span>
          </a>
          <div class="card-main">
            <div class="meta-row">
              <a class="channel-name ch-link" id="cmpChannel" href="#" target="_blank" rel="noopener">알상무</a>
              <span class="cat-tag cat-stock" id="cmpCat">증시·매크로</span>
            </div>
            <h2 class="video-title"><a id="cmpVideoTitle" href="#" target="_blank" rel="noopener"></a></h2>
          </div>
        </div>
        <div class="meta-line yt-time-row">
          <span class="mi mi-rel" id="cmpRel"></span>
          <span class="mi mi-pub" id="cmpPub"></span>
        </div>
      </div>
    </div>

  var DATA = {"meta":{"videoId":"9fRzwt_Dflk","title":"R's Trading Station (11월 27일 금) 풀버젼","channel":"알상무","channelUrl":"https://www.youtube.com/channel/UCiDmfbYvuMEVbRxPmFP4sng","avatar":"https://yt3.googleusercontent.com/JDoKWhh8olpWRLOfuwhoEMrc00B6-WEFF6Sp1pBFiAzjMGslkbePCTJghMauB_t3rG9uuVPHSA=s900-c-k-c0x00ffffff-no-rj","publishedAt":"2026-11-28T02:00:04+09:00","url":"https://www.youtube.com/watch?v=9fRzwt_Dflk","categoryLabel":"증시","category":"stock"},"versions":{"a":{"key":"A","name":"순수 텍스트","diff":"박스·시각화 0 — 1인칭 구어체 줄글과 소제목 6개만, 형광펜은 핵심 단어·숫자에만","blocks":[{"type":"h","text":"코스닥 트레이딩 복기: '금쪽이'에게 밸류를 묻지 마세요"},{"type":"p","text":"금요일 RTS(알스 트레이딩 스테이션) 시작하겠습니다. 이번에 코스닥을 어떻게 대해야 하는지 다들 다시 한번 경험하셨을 텐데요, 코스닥에다 대고 \"네 가치를 증명해 봐\"라며 밸류를 따지면 안 됩니다. 코스닥은 그냥 **금쪽이** 같은 친구라 올라가면 잘한다 잘한다 해주고, 내려가면 안타깝구나 하며 내버려 둬야지, 잔뜩 들어가서 물려버리면 답이 없습니다."},{"type":"p","text":"사실 코스닥이 상대적으로 유리해 보이는 이유를 여덟 가지 정도 꼽을 수는 있지만, 그걸 머리에 넣고 고집을 부리면 또 잃습니다. 저는 650 부근에서 조금씩 담다가 **666** 돌파를 보고(실제 체결은 669) 코스닥 150 추종 ETF를 들어갔는데, 오늘 **6~7%** 급등이 나와서 감사히 일부 차익 실현을 했습니다. 코스닥은 가볍게 먹고 빠져서 자신감과 수익을 쌓는 용도지, 이걸로 일가를 이루겠다고 덤비면 안 됩니다. 진짜 큰돈은 결국 우리 본진인 삼성전자와 SK하이닉스가 다시 돌아설 때 벌어야 합니다."},{"type":"p","text":"단기 차익 실현이 좋은 이유는 밤에 잠을 잘 수 있고 주말에 편히 놀 수 있으며, 번 돈으로 다음 베팅을 할 수 있기 때문입니다. 코스피 고점(6월 19일) 이후 6개월가량 조정을 받았으니 시간적으로도 반등이 나올 만한 구간에 와 있습니다."},{"type":"h","text":"코스피·코스닥·환율 차트 점검과 연말 매매 전략"},{"type":"p","text":"오늘 코스피는 장 초반 약세를 딛고 양봉으로 **+4.34%** 상승 마감했고, 외국인도 프리장 포함 약 **11.5조 원** 순매수하며 오랜만에 힘을 보탰습니다. 다만 주봉으로 보면 겨우 **+0.94%** 양봉이고 여전히 20일·60일·120일 이평선이 위에 있어 추세 자체가 완전히 돌았다고 보기엔 이릅니다. 그래도 개인들이 절망해서 던지기보다 멘탈을 다잡고 미련을 버린 점이 반등의 준비 신호로 읽힙니다."},{"type":"p","text":"코스닥은 **+8%**, 주간으로는 +9.8% 오른 708포인트로 마감했는데, 신용잔고가 2025년 1월 이후 약 2년 내 최저치까지 줄어들어 악성 매물이 싹 정리된 클린한 지수입니다. 내년 1월 중순쯤 주요 이평선들이 내려와 만나는 지점에서 추가 돌파 시 CTA 추종 매수와 쇼트커버가 붙을 여지도 있습니다."},{"type":"p","text":"원/달러 환율은 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 자리라, 다음 주에도 검은선 위에서 버틴다면 기술적으로 다시 위쪽 방향을 볼 수 있는 흐름입니다."},{"type":"p","text":"어제·오늘은 미국 추수감사절 연휴라 양놈 형님들이 안 계신 가벼운 장이었습니다. 월요일(11월 30일) 11월 마지막 영업일에 형님들이 돌아와서 \"어? 많이 올랐네\" 하고 두들겨 팰 수도 있으니 들뜨지 마세요. 크리스마스 연휴(12월 FOMC 이후 12일경부터)엔 플레이어가 아예 사라지므로 **12월 둘째 주**까지 적정 수익을 내고 올해 매매를 정리하는 걸 목표로 삼으시길 권합니다."},{"type":"h","text":"반도체 쏠림의 함정과 52주 신고가·매크로 지표"},{"type":"p","text":"주간으로 삼성전자·하이닉스가 약했던 건 외국인이 개별 기업이 싫어서가 아니라 아시아와 AI 반도체를 묶어서 팔고 있기 때문입니다. 우리나라는 패시브·액티브·가치주·배당주 펀드까지 전부 삼성전자 비중을 의무적으로 채워야 하는 구조라 다양성이 없고, 배당 세제 변화 같은 이슈로 펀드가 깨지면 삼성전자 매물이 쏟아지는 취약점이 있습니다."},{"type":"p","text":"이번 주 코스피에서는 한진칼(경영권 분쟁으로 월간 **+105%**), 코스맥스, 한미사이언스가, 코스닥에서는 화장품 용기 테마의 펌텍코리아와 정치 테마가 붙은 안랩이 52주 신고가를 기록했습니다. 시총 상위주가 막힐 때 로봇·화장품 같은 지엽적 테마가 도는 건 전체 장이 아직 강하지 않다는 방증이기도 합니다."},{"type":"p","text":"미국 3분기 GDP가 **4.3%**, 근원 PCE가 **3.3%**로 나오면서 명목상 약 7%대 상승 압력이 확인됐고 12월 금리 인상 우려가 커졌습니다. 시중에 \"현금을 두면 돈이 녹으니 무조건 투자해야 한다\"는 말이 돌지만, 잘못 투자하면 녹는 게 아니라 그냥 타서 사라진다는 점도 기억하셔야 합니다."},{"type":"h","text":"글로벌 빅테크·AI 인프라 점검: 엔비디아·마이크론·인텔"},{"type":"p","text":"가격 지표를 여러 개 같이 보다 보면 먼저 방향을 틀기 시작하는 녀석들이 보입니다. 지금 원/달러, 코스닥, 금리(한 달 전 전환), 원유(15~20일 전 전환)가 변화를 보여주고 있어 시장 전체의 변곡점이 가까워지고 있는 건 맞지만, 대형 기술주 차트는 아직 갈 길이 멉니다."},{"type":"p","text":"삼성전자와 하이닉스가 돌아서지 않으면 지수 전체가 몇 달 더 횡보할 수 있습니다. 현대차도 20일선에 간신히 붙었지만 차트상 매수할 매력은 아직 안 보입니다. 반면 APR은 실적은 탄탄한데 수급·환율 이슈로 눌려 있던 거라 다음 주 양봉이 서면 위쪽 여력이 있습니다."},{"type":"p","text":"엔비디아와 마이크론 테크놀로지, 일본 키옥시아, 소프트뱅크 그룹은 하락 가속도가 붙거나 악성 매물이 많아 당분간 어렵습니다. 차라리 미국장에 가실 거면 구글이나 메타 같은 하이퍼스케일러 쪽이 낫습니다. 인텔은 정부 지원금을 넣기 직전 자리까지 밀려나며 상업적 경쟁력 한계가 드러났습니다."},{"type":"h","text":"디지털 불멸, 젠슨 황의 복귀, 그리고 마가(MAGA) 진영의 균열"},{"type":"p","text":"오늘은 주식 차트 너머의 미국 정치 지형 변화를 말씀드리고 싶습니다. 최근 일론 머스크가 아이들을 데리고 젠슨 황을 찾아가 사진을 찍었는데, 불과 며칠 전(11월 18~19일) 머스크는 뉴욕타임스 딜북 서밋과 CNBC 인터뷰에서 **\"나는 MAGA가 아니다(I'm not sure what MAGA is)\"**라며 공화당 후원을 후회하는 듯한 발언을 했습니다. 뭔가 불안감을 느낀 두 사람이 동지애로 뭉친 모양새입니다."},{"type":"p","text":"미국 최대 단일 개신교 교단인 남침례회(등록 교인 1,233만 명)는 '브랜트우드 선언(Brentwood Declaration)'을 통해 AI로 고인을 모방하거나 인간과 기계의 경계를 모호하게 만드는 디지털 불멸 기술에 선을 그었습니다. 이들은 MAGA와 트럼프의 핵심 지지 기반이지만, 본질적으로 AI 만능주의나 세속적 도덕 해이와는 충돌할 수밖에 없습니다."},{"type":"p","text":"젠슨 황의 초고속 복귀를 두고 세속 언론은 중국 관련 리스크를 따지지만, 보수 기독교 지지층은 트럼프가 불륜 및 윤리적 문제에 노골적인 면제부를 주는 모습에 큰 배신감과 괴리감을 느끼고 있습니다. 실제로 악시오스(Axios)에서도 젠슨 황 복귀를 계기로 MAGA 진영이 분열되고 있다는 보도가 나왔습니다."},{"type":"h","text":"드라마 〈홈랜드〉로 본 미국의 균열과 한국 증시의 상대적 기회"},{"type":"p","text":"중요한 건 팩트가 아니라 대중의 머릿속에 어떤 이미지가 자리 잡느냐입니다. 마리 앙투아네트가 \"빵이 없으면 케이크(고기)를 먹으면 되지\"라고 실제로 말했는지는 불분명하지만 대중의 증오를 샀듯, 미국 드라마 **〈홈랜드(Homeland)〉 시즌 1 에피소드 11**에서도 테러 위험 속 벙커에 격리된 부통령이 \"사우디아라비아는 건드리지 말고 아무나 한 명 잘라\"라고 지시하는 모습이 그려집니다. 미국 남부 보수층이 혐오하던 '딥스테이트'의 전형을 이제는 **트럼프 본인이 닮아가고 있다**는 인식이 MAGA 내부에 퍼지고 있습니다."},{"type":"p","text":"트럼프가 공화당 내 레임덕에 빠져 집단지도체제(J.D. 밴스 등)로 빠르게 넘어가면 불확실성이 줄어 증시에 호재겠지만, 그립을 놓지 않으려 버티면 향후 6개월간 미국 정치발 혼란이 이어질 수 있습니다. 오히려 스타게이트 등 트럼프 관련 사업들이 정리되면서 **당분간 미국장보다 먼저 빠진 한국장이 상대적으로 나을 수도 있다**는 게 제 생각입니다."},{"type":"p","text":"오늘 낮에 KB증권 **이은택 연구원**과 만나 대중 앞에서 이야기하는 고충에 대해 대화를 나눴는데, 결국 세상도 시장도 우리가 생각하는 것만큼 정교하거나 합리적이지 않습니다. 올해 역대급 상승장에서 아쉽게 수익을 못 내셨더라도 너무 자책하지 마시고 운이 조금 없었을 뿐이라 생각하시며, 다음 반등 타이밍을 저와 함께 차분히 노려보시죠. 금요일 RTS 여기서 마치겠습니다. 감사합니다."}]},"b":{"type":"b","key":"B","name":"구조 분리","diff":"A안 텍스트 그대로 + 나열·대립·종속 레이아웃 — 형광펜·기호 없이 박스 모양만으로 관계를 드러냄","blocks":[{"type":"h","text":"코스닥 트레이딩 복기: '금쪽이'에게 밸류를 묻지 마세요"},{"type":"p","text":"금요일 RTS(알스 트레이딩 스테이션) 시작하겠습니다. 이번에 코스닥을 어떻게 대해야 하는지 다들 다시 한번 경험하셨을 텐데요, 코스닥에다 대고 \"네 가치를 증명해 봐\"라며 밸류를 따지면 안 됩니다."},{"type":"callout","text":"코스닥은 그냥 **금쪽이** 같은 친구라 올라가면 잘한다 잘한다 해주고, 내려가면 안타깝구나 하며 내버려 둬야지, 잔뜩 들어가서 물려버리면 답이 없습니다."},{"type":"p","text":"사실 코스닥이 상대적으로 유리해 보이는 이유를 여덟 가지 정도 꼽을 수는 있지만, 그걸 머리에 넣고 고집을 부리면 또 잃습니다."},{"type":"struct-sub","label":"근거","text":"저는 650 부근에서 조금씩 담다가 **666** 돌파를 보고(실제 체결은 669) 코스닥 150 추종 ETF를 들어갔는데, 오늘 **6~7%** 급등이 나와서 감사히 일부 차익 실현을 했습니다."},{"type":"struct-contrast","label":"대립","left":"코스닥은 가볍게 먹고 빠져서 자신감과 수익을 쌓는 용도지, 이걸로 일가를 이루겠다고 덤비면 안 됩니다.","right":"진짜 큰돈은 결국 우리 본진인 삼성전자와 SK하이닉스가 다시 돌아설 때 벌어야 합니다."},{"type":"p","text":"단기 차익 실현이 좋은 이유는 밤에 잠을 잘 수 있고 주말에 편히 놀 수 있으며, 번 돈으로 다음 베팅을 할 수 있기 때문입니다. 코스피 고점(6월 19일) 이후 6개월가량 조정을 받았으니 시간적으로도 반등이 나올 만한 구간에 와 있습니다."},{"type":"h","text":"코스피·코스닥·환율 차트 점검과 연말 매매 전략"},{"type":"struct-list","label":"나열","items":["오늘 코스피는 장 초반 약세를 딛고 양봉으로 **+4.34%** 상승 마감했고, 외국인도 프리장 포함 약 **11.5조 원** 순매수하며 오랜만에 힘을 보탰습니다. 다만 주봉으로 보면 겨우 **+0.94%** 양봉이고 여전히 20일·60일·120일 이평선이 위에 있어 추세 자체가 완전히 돌았다고 보기엔 이릅니다. 그래도 개인들이 절망해서 던지기보다 멘탈을 다잡고 미련을 버린 점이 반등의 준비 신호로 읽힙니다.","코스닥은 **+8%**, 주간으로는 +9.8% 오른 708포인트로 마감했는데, 신용잔고가 2025년 1월 이후 약 2년 내 최저치까지 줄어들어 악성 매물이 싹 정리된 클린한 지수입니다. 내년 1월 중순쯤 주요 이평선들이 내려와 만나는 지점에서 추가 돌파 시 CTA 추종 매수와 쇼트커버가 붙을 여지도 있습니다.","원/달러 환율은 5일선이 60일선에 붙었고 다음 주 20일선과 60일선이 만나는 자리라, 다음 주에도 검은선 위에서 버틴다면 기술적으로 다시 위쪽 방향을 볼 수 있는 흐름입니다."]},{"type":"p","text":"어제·오늘은 미국 추수감사절 연휴라 양놈 형님들이 안 계신 가벼운 장이었습니다."},{"type":"struct-sub","label":"예외","text":"월요일(11월 30일) 11월 마지막 영업일에 형님들이 돌아와서 \"어? 많이 올랐네\" 하고 두들겨 팰 수도 있으니 들뜨지 마세요."},{"type":"callout","text":"크리스마스 연휴(12월 FOMC 이후 12일경부터)엔 플레이어가 아예 사라지므로 **12월 둘째 주**까지 적정 수익을 내고 올해 매매를 정리하는 걸 목표로 삼으시길 권합니다."},{"type":"h","text":"반도체 쏠림의 함정과 52주 신고가·매크로 지표"},{"type":"p","text":"주간으로 삼성전자·하이닉스가 약했던 건 외국인이 개별 기업이 싫어서가 아니라 아시아와 AI 반도체를 묶어서 팔고 있기 때문입니다."},{"type":"struct-sub","label":"근거","text":"우리나라는 패시브·액티브·가치주·배당주 펀드까지 전부 삼성전자 비중을 의무적으로 채워야 하는 구조라 다양성이 없고, 배당 세제 변화 같은 이슈로 펀드가 깨지면 삼성전자 매물이 쏟아지는 취약점이 있습니다."},{"type":"p","text":"이번 주 코스피에서는 한진칼(경영권 분쟁으로 월간 **+105%**), 코스맥스, 한미사이언스가, 코스닥에서는 화장품 용기 테마의 펌텍코리아와 정치 테마가 붙은 안랩이 52주 신고가를 기록했습니다."},{"type":"callout","text":"시총 상위주가 막힐 때 로봇·화장품 같은 지엽적 테마가 도는 건 전체 장이 아직 강하지 않다는 방증이기도 합니다."},{"type":"p","text":"미국 3분기 GDP가 **4.3%**, 근원 PCE가 **3.3%**로 나오면서 명목상 약 7%대 상승 압력이 확인됐고 12월 금리 인상 우려가 커졌습니다. 시중에 \"현금을 두면 돈이 녹으니 무조건 투자해야 한다\"는 말이 돌지만, 잘못 투자하면 녹는 게 아니라 그냥 타서 사라진다는 점도 기억하셔야 합니다."},{"type":"h","text":"글로벌 빅테크·AI 인프라 점검: 엔비디아·마이크론·인텔"},{"type":"p","text":"가격 지표를 여러 개 같이 보다 보면 먼저 방향을 틀기 시작하는 녀석들이 보입니다."},{"type":"struct-sub","label":"세부","text":"지금 원/달러, 코스닥, 금리(한 달 전 전환), 원유(15~20일 전 전환)가 변화를 보여주고 있어 시장 전체의 변곡점이 가까워지고 있는 건 맞지만, 대형 기술주 차트는 아직 갈 길이 멉니다."},{"type":"struct-list","label":"나열","items":["삼성전자와 하이닉스가 돌아서지 않으면 지수 전체가 몇 달 더 횡보할 수 있습니다.","현대차도 20일선에 간신히 붙었지만 차트상 매수할 매력은 아직 안 보입니다.","반면 APR은 실적은 탄탄한데 수급·환율 이슈로 눌려 있던 거라 다음 주 양봉이 서면 위쪽 여력이 있습니다."]},{"type":"struct-contrast","label":"대립","left":"엔비디아와 마이크론 테크놀로지, 일본 키옥시아, 소프트뱅크 그룹은 하락 가속도가 붙거나 악성 매물이 많아 당분간 어렵습니다.","right":"차라리 미국장에 가실 거면 구글이나 메타 같은 하이퍼스케일러 쪽이 낫습니다."},{"type":"struct-sub","label":"세부","text":"인텔은 정부 지원금을 넣기 직전 자리까지 밀려나며 상업적 경쟁력 한계가 드러났습니다."},{"type":"h","text":"디지털 불멸, 젠슨 황의 복귀, 그리고 마가(MAGA) 진영의 균열"},{"type":"p","text":"오늘은 주식 차트 너머의 미국 정치 지형 변화를 말씀드리고 싶습니다."},{"type":"struct-sub","label":"근거","text":"최근 일론 머스크가 아이들을 데리고 젠슨 황을 찾아가 사진을 찍었는데, 불과 며칠 전(11월 18~19일) 머스크는 뉴욕타임스 딜북 서밋과 CNBC 인터뷰에서 **\"나는 MAGA가 아니다(I'm not sure what MAGA is)\"**라며 공화당 후원을 후회하는 듯한 발언을 했습니다."},{"type":"p","text":"뭔가 불안감을 느낀 두 사람이 동지애로 뭉친 모양새입니다."},{"type":"struct-contrast","label":"대립","left":"미국 최대 단일 개신교 교단인 남침례회(등록 교인 1,233만 명)는 '브랜트우드 선언(Brentwood Declaration)'을 통해 AI로 고인을 모방하거나 인간과 기계의 경계를 모호하게 만드는 디지털 불멸 기술에 선을 그었습니다.","right":"이들은 MAGA와 트럼프의 핵심 지지 기반이지만, 본질적으로 AI 만능주의나 세속적 도덕 해이와는 충돌할 수밖에 없습니다."},{"type":"p","text":"젠슨 황의 초고속 복귀를 두고 세속 언론은 중국 관련 리스크를 따지지만, 보수 기독교 지지층은 트럼프가 불륜 및 윤리적 문제에 노골적인 면제부를 주는 모습에 큰 배신감과 괴리감을 느끼고 있습니다."},{"type":"struct-sub","label":"근거","text":"실제로 악시오스(Axios)에서도 젠슨 황 복귀를 계기로 MAGA 진영이 분열되고 있다는 보도가 나왔습니다."},{"type":"h","text":"드라마 〈홈랜드〉로 본 미국의 균열과 한국 증시의 상대적 기회"},{"type":"p","text":"중요한 건 팩트가 아니라 대중의 머릿속에 어떤 이미지가 자리 잡느냐입니다."},{"type":"struct-sub","label":"세부","text":"마리 앙투아네트가 \"빵이 없으면 케이크(고기)를 먹으면 되지\"라고 실제로 말했는지는 불분명하지만 대중의 증오를 샀듯, 미국 드라마 **〈홈랜드(Homeland)〉 시즌 1 에피소드 11**에서도 테러 위험 속 벙커에 격리된 부통령이 \"사우디아라비아는 건드리지 말고 아무나 한 명 잘라\"라고 지시하는 모습이 그려집니다."},{"type":"p","text":"미국 남부 보수층이 혐오하던 '딥스테이트'의 전형을 이제는 **트럼프 본인이 닮아가고 있다**는 인식이 MAGA 내부에 퍼지고 있습니다."},{"type":"struct-contrast","label":"대립","left":"트럼프가 공화당 내 레임덕에 빠져 집단지도체제(J.D. 밴스 등)로 빠르게 넘어가면 불확실성이 줄어 증시에 호재겠지만,","right":"그립을 놓지 않으려 버티면 향후 6개월간 미국 정치발 혼란이 이어질 수 있습니다."},{"type":"callout","text":"오히려 스타게이트 등 트럼프 관련 사업들이 정리되면서 **당분간 미국장보다 먼저 빠진 한국장이 상대적으로 나을 수도 있다**는 게 제 생각입니다."},{"type":"p","text":"오늘 낮에 KB증권 **이은택 연구원**과 만나 대중 앞에서 이야기하는 고충에 대해 대화를 나눴는데, 결국 세상도 시장도 우리가 생각하는 것만큼 정교하거나 합리적이지 않습니다. 올해 역대급 상승장에서 아쉽게 수익을 못 내셨더라도 너무 자책하지 마시고 운이 조금 없었을 뿐이라 생각하시며, 다음 반등 타이밍을 저와 함께 차분히 노려보시죠. 금요일 RTS 여기서 마치겠습니다. 감사합니다."}]},"c":{"key":"C","name":"시각화 몰빵","diff":"긴 줄글 대신 인포그래픽 12개 + 화자 한마디 — 같은 방송·같은 수치로 재구성","blocks":[{"type":"map","title":"방송 요약 맵 — 6개 주제","cards":[{"n":"①","t":"코스닥 타점","d":"650 분할 → 666 돌파 → 669 체결 · 6~7% 익절","tone":"accent"},{"n":"②","t":"시장 · 연말","d":"코스피 +4.34% · 코스닥 708p · 12월 둘째 주 정리","tone":"blue"},{"n":"③","t":"반도체 · 신고가","d":"52주 신고가 5종목 · GDP 4.3% / 근원 PCE 3.3%","tone":"violet"},{"n":"④","t":"빅테크 · AI","d":"AI 반도체·장비는 어렵다 → 하이퍼스케일러","tone":"amber"},{"n":"⑤","t":"디지털 불멸 · MAGA","d":"등록 교인 1,233만 명의 선언 ↔ 역린","tone":"red"},{"n":"⑥","t":"홈랜드 · 한국장","d":"집단지도체제 호재 vs 6개월 혼란","tone":"green"}]},{"type":"callout","text":"코스닥은 그냥 **금쪽이** 같은 친구라 올라가면 잘한다 잘한다 해주고, 내려가면 안타깝구나 하며 내버려 둬야지, 잔뜩 들어가서 물려버리면 답이 없습니다."},{"type":"h","text":"코스닥 트레이딩 복기: '금쪽이'에게 밸류를 묻지 마세요"},{"type":"svg","title":"내 코스닥 진입 경로 — 650 → 666 → 669","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 154\" class=\"ig\" role=\"img\"><rect x=\"18\" y=\"10\" width=\"112\" height=\"22\" rx=\"11\" class=\"sf-a\"/><text x=\"74\" y=\"25\" class=\"t2 c-a\" text-anchor=\"middle\">오늘 6~7% 익절</text><rect x=\"72.0\" y=\"74\" width=\"172.8\" height=\"30\" rx=\"7\" class=\"sf-g\"/><text x=\"158.4\" y=\"93\" class=\"t2 c-g\" text-anchor=\"middle\">650 부근 분할 매수</text><line x1=\"244.8\" y1=\"44\" x2=\"244.8\" y2=\"104\" class=\"dash\"/><text x=\"241.8\" y=\"38\" class=\"t2 c-a\" text-anchor=\"end\">666 돌파선</text><line x1=\"18\" y1=\"104\" x2=\"342\" y2=\"104\" class=\"axis\"/><line x1=\"18.0\" y1=\"104\" x2=\"18.0\" y2=\"109\" class=\"tick\"/><text x=\"18.0\" y=\"122\" class=\"t3 ax\" text-anchor=\"middle\">645</text><line x1=\"72.0\" y1=\"104\" x2=\"72.0\" y2=\"109\" class=\"tick\"/><text x=\"72.0\" y=\"122\" class=\"t3 ax\" text-anchor=\"middle\">650</text><line x1=\"126.0\" y1=\"104\" x2=   /* ── 유틸 (assets/app.js 와 동일 규칙) ─────────────────── */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

     문장은 한 글자도 손대지 않고, 문단 사이 관계만 박스 모양으로 드러낸다. */
  function stTag(mark, label) {

    }
    tg.appendChild(document.createTextNode(label));
    return tg;
  }
  function buildStructList(b) {

    box.appendChild(ul);
    return box;

  function buildStructContrast(b) {

  function splitParagraph(text) {
    var t = String(text || '').trim();
    if (t.length < 210) return [t];
    var parts = t.split(/(?<=[.?!])\s+(?=[가-힣A-Za-z0-9"'(\[])/);
    if (parts.length <= 2) return [t];
    var out = [], buf = '', count = 0;
    for (var i = 0; i < parts.length; i++) {
      buf = buf ? (buf + ' ' + parts[i]) : parts[i];
      count++;
      if ((count >= 2 && buf.length >= 130) || count >= 3) { out.push(buf); buf = ''; count = 0; }
    }
    if (buf) {
      if (out.length && buf.length < 55) out[out.length - 1] += ' ' + buf;
      else out.push(buf);

    return out.length ? out : [t];
  }

  function buildLevels(b) {

    var nums = levels.map(function (lv) {

  function buildTable(b) {

    box.appendChild(wrap);

    return box;
  }

  /* 자유형 SVG — 화이트리스트 태그만 남기고 스크립트·이벤트·javascript: URL 제거 */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SVG_TAGS = {
    svg: 1, g: 1, defs: 1, title: 1, desc: 1, symbol: 1, use: 1,
    lineargradient: 1, radialgradient: 1, stop: 1, pattern: 1, clippath: 1, mask: 1, marker: 1,
    path: 1, rect: 1, circle: 1, ellipse: 1, line: 1, polyline: 1, polygon: 1,
    text: 1, tspan: 1, textpath: 1
  };
  var SVG_BAD_URL = /(javascript|vbscript|data)\s*:/i;

  function cleanSvgAttrs(el) {
    var attrs = [];
    for (var i = 0; i < el.attributes.length; i++) attrs.push(el.attributes[i]);
    attrs.forEach(function (a) {
      var name = String(a.name || '').toLowerCase();
      var val = String(a.value == null ? '' : a.value);
      var drop = false;
      if (name.indexOf('on') === 0) drop = true;
      else if (name === 'href' || name.slice(-5) === ':href') { if (!/^\s*#/.test(val)) drop = true; }
      if (!drop && (SVG_BAD_URL.test(val) || /expression\s*\(/i.test(val))) drop = true;
      if (drop) el.removeAttribute(a.name);
    });
  }
  function cleanSvgTree(node) {
    var children = [];
    for (var i = 0; i < node.childNodes.length; i++) children.push(node.childNodes[i]);
    children.forEach(function (ch) {
      if (ch.nodeType === 1) {
        var name = String(ch.nodeName || '').toLowerCase();
        if (name.indexOf(':') >= 0) name = name.split(':').pop();
        var ns = ch.namespaceURI;
        if (!SVG_TAGS[name] || (ns && ns !== SVG_NS)) { node.removeChild(ch); return; }
        cleanSvgAttrs(ch);
        cleanSvgTree(ch);
      } else if (ch.nodeType !== 3) {
        node.removeChild(ch);
      }
    });
  }
  function sanitizeSvg(src) {
    var txt = String(src == null ? '' : src).trim();
    if (!txt || !/^<svg[\s>]/i.test(txt)) return null;
    var doc = null;
    try { doc = new DOMParser().parseFromString(txt, 'image/svg+xml'); } catch (e) { return null; }
    if (!doc || !doc.documentElement || doc.querySelector('parsererror')) return null;
    var root = doc.documentElement;
    if (String(root.nodeName).toLowerCase() !== 'svg') return null;
    var w = parseFloat(root.getAttribute('width'));
    var hh = parseFloat(root.getAttribute('height'));
    cleanSvgAttrs(root);
    cleanSvgTree(root);
    root.removeAttribute('width');
    root.removeAttribute('height');
    if (!root.getAttribute('viewBox') && isFinite(w) && isFinite(hh) && w > 0 && hh > 0) {
      root.setAttribute('viewBox', '0 0 ' + w + ' ' + hh);
    }
    root.setAttribute('class', ((root.getAttribute('class') || '') + ' svg-canvas').trim());
    root.setAttribute('width', '100%');
    /* height 는 CSS(.svg-holder svg{height:auto})가 잡는다 — height="auto" 속성은 표준에 없어 콘솔 오류를 낸다 */
    root.setAttribute('focusable', 'false');
    if (!root.getAttribute('role')) root.setAttribute('role', 'img');
    return new XMLSerializer().serializeToString(root);
  }
  function buildSvg(b) {
    var box = vizShell('svg', b.title);
    var markup = sanitizeSvg(b.svg);
    if (markup) {
      var holder = mk('div', 'svg-holder');
      holder.innerHTML = markup;
      if (holder.querySelector('svg')) box.appendChild(holder);
    }
    if (b.caption) box.appendChild(mk('div', 'svg-caption', rich(String(b.caption))));
    return box;
  }

  /* ── 본문 블록 ─────────────────────────────────────── */
  var VIZ_KEYS = { stats: 1, levels: 1, flow: 1, compare: 1, table: 1, svg: 1, bars: 1, donut: 1, timeline: 1, map: 1, vs: 1, cards: 1, signal: 1 };

  function blockEl(b) {
    if (!b) return null;
    if (b.type === 'h') return mk('div', 'section-title', rich(b.text || ''));
    if (b.type === 'ul' || b.type === 'ol') {
      var list = mk(b.type === 'ol' ? 'ol' : 'ul', 'bullets');
      (b.items || []).forEach(function (it) {
        var li = mk('li', '', rich(it));
        list.appendChild(li);
      });
      return list;
    }
    if (b.type === 'callout') {
      var co = mk('div', 'callout');
      var qm = mk('span', 'callout-q');
      qm.setAttribute('aria-hidden', 'true');
      qm.textContent = '\u201C';
      co.appendChild(qm);
      co.appendChild(mk('div', 'callout-txt', rich(b.text || '')));
      return co;
    }
    if (b.type === 'struct-list') return buildStructList(b);
    if (b.type === 'struct-contrast') return buildStructContrast(b);
    if (b.type === 'struct-sub') return buildStructSub(b);
    if (b.type === 'stats') return buildStats(b);
    if (b.type === 'levels') return buildLevels(b);
    if (b.type === 'flow') return buildFlow(b);
    if (b.type === 'compare') return buildCompare(b);
    if (b.type === 'table') return buildTable(b);
    if (b.type === 'svg') return buildSvg(b);
    if (b.type === 'map') return buildMap(b);
    if (b.type === 'vs') return buildVs(b);
    if (b.type === 'cards') return buildCards(b);
    if (b.type === 'signal') return buildSignal(b);
    var frag = document.createDocumentFragment();
    splitParagraph(b.text || '').forEach(function (chunk) {
      frag.appendChild(mk('p', '', rich(chunk)));
    });
    return frag;
  }

  /* ── 버전 요약 수치 ────────────────────────────────── */
  function collectText(blocks) {
    var out = [];
    blocks.forEach(function (b) {
      if (!b) return;
      if (b.text) out.push(b.text);
      if (b.title) out.push(b.title);
      if (b.caption) out.push(b.caption);
      (b.items || []).forEach(function (it) {
        if (typeof it === 'string') out.push(it);
        else if (it) out.push([it.label, it.value, it.sub].filter(Boolean).join(' '));
      });
      (b.steps || []).forEach(function (st) { if (st) out.push([st.label, st.note].filter(Boolean).join(' ')); });
      (b.cols || []).forEach(function (c) {
        if (!c) return;
        out.push([c.title, c.badge].filter(Boolean).join(' '));
        (c.points || []).forEach(function (pt) { out.push(String(pt)); });
      });
      (b.rows || []).forEach(function (r) { (r || []).forEach(function (c) { out.push(String(c)); }); });
      (b.levels || []).forEach(function (lv) { if (lv) out.push(String(lv.label || '')); });
    });
    return out.join(' ');
  }
  function metrics(v) {
    var blocks = v.blocks;
    var txt = collectText(blocks);
    var tok = (txt.match(/\{\{[GYRB][UWD]?\|/g) || []).length;
    var ul = (txt.match(/\{\{(?:[GYRB])?[UWD]\|/g) || []).length;
    var bold = (txt.match(/\*\*[^*]+\*\*/g) || []).length;
    var hl = tok || bold;
    var sym = (txt.match(/[★●▲■]/g) || []).length;
    var boxes = blocks.filter(function (b) { return b && (b.type === 'callout' || b.type === 'ul' || b.type === 'ol'); }).length;
    var vizs = blocks.filter(function (b) { return b && VIZ_KEYS[b.type]; }).length;
    var lists = blocks.filter(function (b) { return b && b.type === 'struct-list'; }).length;
    var contrasts = blocks.filter(function (b) { return b && b.type === 'struct-contrast'; }).length;
    var subs = blocks.filter(function (b) { return b && b.type === 'struct-sub'; }).length;
    var cards = blocks.reduce(function (n, b) {
      if (!b) return n;
      return n + (b.type === 'map' ? (b.cards || []).length : 0)
        + (b.type === 'cards' ? (b.items || []).length : 0)
        + (b.type === 'signal' ? (b.items || []).length : 0)
        + (b.type === 'stats' ? (b.items || []).length : 0)
        + (b.type === 'vs' ? 2 : 0);
    }, 0);
    return { hl: hl, ul: ul, sym: sym, boxes: boxes, vizs: vizs, cards: cards, lists: lists, contrasts: contrasts, subs: subs };
  }

  /* ── 테마 ──────────────────────────────────────────── */
  var themeBtn = document.getElementById('themeBtn');
  var themeLbl = document.getElementById('themeLbl');
  var themeSvg = document.getElementById('themeSvg');
  function paintThemeBtn() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeLbl.textContent = dark ? '라이트' : '다크';
    themeSvg.innerHTML = dark
      ? '<circle cx="10" cy="10" r="3.6"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M15.3 4.7 14 6M6 14l-1.3 1.3"/>'
      : '<path d="M15.8 12.6A6.5 6.5 0 0 1 7.4 4.2a6.5 6.5 0 1 0 8.4 8.4Z"/>';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('yts.theme', next); } catch (e) {}
    paintThemeBtn();
  });
  paintThemeBtn();

  /* ── 헤더 정보 ─────────────────────────────────────── */
  document.getElementById('cmpTitle').textContent = META.title;
  document.getElementById('cmpVideoTitle').textContent = META.title;
  document.getElementById('cmpVideoTitle').href = META.url;
  document.getElementById('cmpChannel').textContent = META.channel;
  document.getElementById('cmpChannel').href = META.channelUrl;
  document.getElementById('cmpChLink').href = META.channelUrl;
  document.getElementById('cmpCat').textContent = META.categoryLabel;
  document.getElementById('cmpCat').className = 'cat-tag cat-' + (META.category || 'etc');
  var av = document.getElementById('cmpAvatar');
  var avImg = new Image();
  avImg.alt = META.channel;
  avImg.referrerPolicy = 'no-referrer';
  avImg.onload = function () { av.textContent = ''; av.appendChild(avImg); };
  avImg.src = META.avatar;
  var thumb = document.getElementById('cmpThumb');
  thumb.alt = META.title + ' 썸네일';
  thumb.src = 'https://i.ytimg.com/vi/' + META.videoId + '/mqdefault.jpg';
  document.getElementById('cmpThumbLink').href = META.url;

  (function () {
    var d = new Date(META.publishedAt);
    if (isNaN(d.getTime())) return;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('cmpPub').textContent = (d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()));
    var diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
    var rel = diffMin < 60 ? (diffMin < 1 ? '방금 전' : diffMin + '분 전')
      : diffMin < 1440 ? Math.floor(diffMin / 60) + '시간 전'
      : diffMin < 10080 ? Math.floor(diffMin / 1440) + '일 전'
      : Math.floor(diffMin / 43200) + '개월 전';
    document.getElementById('cmpRel').textContent = rel;
  })();

  /* ── 탭 렌더 ───────────────────────────────────────── */
  var body = document.getElementById('cmpBody');
  var note = document.getElementById('cmpNote');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.cg-tab'));

  ['a', 'b', 'c'].forEach(function (k) {
    var m = metrics(VERSIONS[k]);
    var el = document.querySelector('.cg-tab-m[data-meta="' + k + '"]');
    el.textContent = k === 'c'
      ? '시각화 ' + m.vizs + ' · 카드 ' + m.cards
      : k === 'b'
        ? '나열 ' + m.lists + ' · 대립 ' + m.contrasts + ' · 종속 ' + m.subs
        : '박스 ' + m.boxes + ' · 형광펜 ' + m.hl;
  });

  function setVersion(v, opts) {
    if (!VERSIONS[v]) v = 'a';
    state.v = v;
    var ver = VERSIONS[v];
    body.className = 'body-inner v-' + v;
    body.innerHTML = '';
    var frag = document.createDocumentFragment();
    ver.blocks.forEach(function (b) {
      var el = blockEl(b);
      if (el) frag.appendChild(el);
    });
    body.appendChild(frag);
    tabs.forEach(function (t) {
      t.setAttribute('aria-selected', t.dataset.v === v ? 'true' : 'false');
      t.tabIndex = t.dataset.v === v ? 0 : -1;
    });
    note.innerHTML = '<span class="cg-note-k">' + ver.key + '안</span> ' + rich(ver.diff) +
      ' <span class="cg-note-hint">탭으로 바로 전환</span>';
    try { localStorage.setItem('cmp.alsangmu.version', v); } catch (e) {}
    if (!opts || !opts.keepHash) {
      if (history.replaceState) history.replaceState(null, '', '#' + v);
    }
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { setVersion(t.dataset.v); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var order = ['a', 'b', 'c'];
      var i = order.indexOf(state.v) + (e.key === 'ArrowRight' ? 1 : -1);
      if (i < 0) i = 2; if (i > 2) i = 0;
      setVersion(order[i]);
    }
  });

  var initial = (location.hash || '').replace('#', '').toLowerCase();
  if (!VERSIONS[initial]) { try { initial = localStorage.getItem('cmp.alsangmu.version') || 'a'; } catch (e) { initial = 'a'; } }
  setVersion(VERSIONS[initial] ? initial : 'a');
})();
</script>
</body>
</html>
