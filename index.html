<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="피클 유튜브 요약 — 화자의 말투와 뉘앙스를 살린 상세 요약 아카이브" />
<meta property="og:type" content="website" />
<meta property="og:title" content="피클 유튜브 요약" />
<meta property="og:description" content="화자의 말투와 뉘앙스를 그대로 살린 유튜브 상세 요약" />
<meta name="theme-color" content="#f4f6fa" id="metaThemeLight" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0f17" id="metaThemeDark" media="(prefers-color-scheme: dark)" />
<title>피클 유튜브 요약</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/style.css?v=20261121u" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('yts.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="container">
  <header class="hub-card" id="siteHeader">
    <div class="hub-top">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <defs>
              <linearGradient id="pkBg" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#10b981"/>
                <stop offset="55%" stop-color="#059669"/>
                <stop offset="100%" stop-color="#0f766e"/>
              </linearGradient>
              <linearGradient id="pkShine" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
                <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#pkBg)"/>
            <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#pkShine)"/>
            <rect x="2.5" y="2.5" width="35" height="35" rx="10.5" stroke="#ffffff" stroke-opacity="0.22"/>
            <path d="M16.2 13.8c0-1.05 1.15-1.7 2.05-1.15l9.4 5.75c.85.52.85 1.78 0 2.3l-9.4 5.75c-.9.55-2.05-.1-2.05-1.15V13.8Z" fill="#ffffff"/>
            <circle cx="29.5" cy="10.5" r="2.1" fill="#a7f3d0"/>
          </svg>
        </span>
        <div class="title-block">
          <h1>피클 유튜브 요약</h1>
          <div class="date-sub" id="subtitle">불러오는 중…</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="sortBtn" type="button" title="정렬 전환">
          <svg class="btn-svg" id="sortSvg" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M5.5 11.5 10 16l4.5-4.5"/></svg>
          <span class="btn-lbl" id="sortLbl">최신순</span>
        </button>
        <button class="btn" id="themeBtn" type="button" title="테마 전환">
          <svg class="btn-svg" id="themeSvg" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.8 12.6A6.5 6.5 0 0 1 7.4 4.2a6.5 6.5 0 1 0 8.4 8.4Z"/></svg>
          <span class="btn-lbl" id="themeLbl">다크</span>
        </button>
      </div>
    </div>

    <div class="hub-tabs">
      <div class="tab-bar tab-bar-7" role="tablist" aria-label="날짜, 목차, 분류, 채널, 읽음, 좋아요, 검색 탭">
        <button class="tab-btn" type="button" role="tab" id="tabBtnDate" data-tab="date" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M6.5 2.5v3M13.5 2.5v3M3 8.5h14"/></svg>
          <span id="tabLabelDate">전체</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnToc" data-tab="toc" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h8"/></svg>
          <span>목차</span>
          <span class="tab-badge" id="tabBadgeToc">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnCat" data-tab="cat" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h4.17a2 2 0 0 1 1.41.59l5.33 5.33a2 2 0 0 1 0 2.82l-4.67 4.67a2 2 0 0 1-2.82 0L3.59 11.08A2 2 0 0 1 3 9.67V5.5Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
          <span>분류</span>
          <span class="tab-badge" id="tabBadgeCat">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnChannel" data-tab="channel" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5"/><path d="m8.5 8 4 2-4 2V8Z" fill="currentColor" stroke="none"/></svg>
          <span>채널</span>
          <span class="tab-badge" id="tabBadgeChannel">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnRead" data-tab="read" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.2"/><path d="M7.5 10.2 9.2 12l3.4-3.8"/></svg>
          <span>읽음</span>
          <span class="tab-badge" id="tabBadgeRead">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnFav" data-tab="fav" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16.5s-6-3.7-6-8.3A3.5 3.5 0 0 1 10 5.7a3.5 3.5 0 0 1 6 2.5c0 4.6-6 8.3-6 8.3Z"/></svg>
          <span>좋아요</span>
          <span class="tab-badge" id="tabBadgeFav">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" id="tabBtnSearch" data-tab="search" aria-selected="false">
          <svg class="tab-svg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m13 13 3.8 3.8"/></svg>
          <span>검색</span>
          <span class="tab-badge" id="tabBadgeSearch">0</span>
        </button>
      </div>

      <div class="tab-panel" id="tabPanel" hidden>
        <div class="tab-pane" id="paneDate" hidden>
          <div class="pane-meta" id="dateMeta"></div>
          <nav class="filters wrap" id="dateChips" aria-label="날짜 선택"></nav>
        </div>
        <div class="tab-pane" id="paneCat" hidden>
          <div class="pane-meta" id="catMeta"></div>
          <nav class="filters wrap" id="catChips" aria-label="분류 필터"></nav>
        </div>
        <div class="tab-pane" id="paneChannel" hidden>
          <div class="pane-meta" id="channelMeta"></div>
          <nav class="filters wrap" id="channelChips" aria-label="채널 필터"></nav>
        </div>
        <div class="tab-pane" id="paneToc" hidden>
          <ul class="toc-list" id="tocList"></ul>
        </div>
        <div class="tab-pane" id="paneRead" hidden>
          <ul class="toc-list" id="readList"></ul>
        </div>
        <div class="tab-pane" id="paneFav" hidden>
          <ul class="toc-list" id="favList"></ul>
        </div>
        <div class="tab-pane" id="paneSearch" hidden>
          <div class="search-row">
            <svg class="search-ico" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="8.5" cy="8.5" r="5.5"></circle>
              <path d="M13 13l4 4"></path>
            </svg>
            <input id="search" type="search" inputmode="search" autocomplete="off"
                   placeholder="제목·채널·본문 내용 검색" aria-label="검색" />
            <button class="search-clear" id="searchClear" type="button" aria-label="검색어 지우기" hidden>×</button>
          </div>
          <div class="search-meta" id="searchMeta"></div>
          <ul class="toc-list" id="searchResultList"></ul>
        </div>
      </div>
    </div>
  </header>

  <main id="feed">
    <div class="state" id="state">불러오는 중…</div>
  </main>

  <footer class="site-footer">
    <div id="footerMeta"></div>
    <div class="footer-note">
      화자의 말투와 뉘앙스를 그대로 살려 옮긴 기록입니다. 썸네일이나 제목을 누르면 유튜브로 이동합니다.
    </div>
    <div class="footer-note">
      <a href="https://github.com/0xhangang/youtube-summary" target="_blank" rel="noopener">github.com/0xhangang/youtube-summary</a>
    </div>
  </footer>
</div>

<button class="top-btn" id="topBtn" type="button" title="맨 위로" aria-label="맨 위로">
  <svg class="top-svg" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5V4.5M5.5 9 10 4.5 14.5 9"/></svg>
</button>

<script src="assets/app.js?v=20261121u"></script>
</body>
</html>
