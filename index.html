<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="관심 유튜브 채널 자동 요약 아카이브 — 화자의 말투 그대로 옮긴 상세 요약" />
<title>📺 유튜브 상세 요약</title>
<link rel="stylesheet" href="assets/style.css?v=20261118b" />
<script>
  // 테마를 그리기 전에 먼저 결정해 깜빡임을 막는다
  (function () {
    try {
      var saved = localStorage.getItem('yts.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="container">
  <header class="site-header">
    <div class="header-top">
      <div class="title-block">
        <h1>📺 유튜브 상세 요약</h1>
        <div class="date-sub" id="subtitle">불러오는 중…</div>
      </div>
      <div class="controls">
        <button class="btn" id="toggleAllBtn" type="button">모두 접기</button>
        <button class="btn" id="themeBtn" type="button" title="다크 모드">🌙 다크</button>
      </div>
    </div>
    <nav class="filters" id="dateChips" aria-label="날짜 선택"></nav>
  </header>

  <section class="toolbar" aria-label="필터와 검색">
    <div class="search-row">
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="제목·채널·본문 검색" aria-label="검색" />
    </div>
    <nav class="filters" id="catChips" aria-label="분류 필터"></nav>
    <nav class="filters" id="channelChips" aria-label="채널 필터"></nav>
    <div class="read-row">
      <label class="switch">
        <input type="checkbox" id="unreadOnly" />
        <span>안 읽은 것만</span>
      </label>
      <button class="linkish" id="markAllBtn" type="button">모두 읽음</button>
    </div>
  </section>

  <details class="toc" id="tocBox">
    <summary class="toc-title" id="tocTitle">📑 목차</summary>
    <ul class="toc-list" id="tocList"></ul>
  </details>

  <main id="feed">
    <div class="state" id="state">불러오는 중…</div>
  </main>

  <footer class="site-footer">
    <div id="footerMeta"></div>
    <div class="footer-note">
      요약은 유튜버의 말투와 뉘앙스를 그대로 살려 옮긴 기록입니다. 원문은 각 영상 링크에서 확인하세요.
    </div>
    <div class="footer-note">
      <a href="https://github.com/0xhangang/youtube-summary" target="_blank" rel="noopener">github.com/0xhangang/youtube-summary</a>
    </div>
  </footer>
</div>

<button class="top-btn" id="topBtn" type="button" title="맨 위로" aria-label="맨 위로">↑</button>

<script src="assets/app.js?v=20261118b"></script>
</body>
</html>
