<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="관심 유튜브 채널 자동 요약 아카이브 — 화자의 말투 그대로 옮긴 상세 요약" />
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
<title>📺 유튜브 상세 요약</title>
<link rel="stylesheet" href="assets/style.css?v=20261119c" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('yts.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="container">
  <header class="site-header" id="siteHeader">
    <div class="header-top">
      <div class="title-block">
        <h1>📺 유튜브 상세 요약</h1>
        <div class="date-sub" id="subtitle">불러오는 중…</div>
      </div>
      <div class="controls">
        <button class="btn" id="resetFilterBtn" type="button" hidden>↺ 초기화</button>
        <button class="btn" id="themeBtn" type="button" title="다크 모드">🌙 다크</button>
      </div>
    </div>
    <nav class="filters date-filters" id="dateChips" aria-label="날짜 선택"></nav>
  </header>

  <section class="toolbar" aria-label="필터와 검색">
    <div class="search-row">
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="제목·채널·본문 검색" aria-label="검색" />
      <svg class="search-ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="8.5" cy="8.5" r="5.5"></circle>
        <path d="M13 13l4 4"></path>
      </svg>
    </div>
    <div class="fgroup">
      <div class="fhead">분류</div>
      <nav class="filters wrap" id="catChips" aria-label="분류 필터"></nav>
    </div>
    <div class="fgroup" id="channelRow">
      <div class="fhead">채널</div>
      <nav class="filters wrap" id="channelChips" aria-label="채널 필터"></nav>
    </div>
  </section>

  <details class="toc" id="tocBox">
    <summary class="toc-title" id="tocTitle">📑 목차</summary>
    <ul class="toc-list" id="tocList"></ul>
  </details>

  <main id="feed">
    <div class="state" id="state">불러오는 중…</div>
  </main>

  <footer class="site-footer">
    <div id="footerMeta"></div>
    <div class="footer-note">
      요약은 유튜버의 말투와 뉘앙스를 그대로 살려 옮긴 기록입니다. 썸네일을 누르면 유튜브 영상으로 이동합니다.
    </div>
    <div class="footer-note">
      <a href="https://github.com/0xhangang/youtube-summary" target="_blank" rel="noopener">github.com/0xhangang/youtube-summary</a>
    </div>
  </footer>
</div>

<button class="top-btn" id="topBtn" type="button" title="맨 위로" aria-label="맨 위로">↑</button>

<script src="assets/app.js?v=20261119c"></script>
</body>
</html>
