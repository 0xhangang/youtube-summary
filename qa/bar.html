<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>읽기 바 레이아웃 확인용 (임시)</title>
<style>
  html, body { margin: 0; padding: 0; background: #dfe4ec; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 11px; color: #334155; letter-spacing: .02em; height: 14px; }
  iframe { border: 0; display: block; background: #fff; box-shadow: 0 2px 10px rgba(15,23,42,.18); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '390', 10);
  var h = parseInt(p.get('h') || '844', 10);
  var mode = p.get('mode') || 'mid';
  var themes = (p.get('themes') || 'light,dark').split(',');
  var row = document.getElementById('row');

  function start(f, lbl, theme) {
    var win, doc;
    try {
      win = f.contentWindow;
      doc = win.document;
    } catch (e) { return false; }
    var card = doc.querySelector('.card');
    if (!card || !card.querySelector('.card-bar')) return false;

    win.localStorage.setItem('yts.theme', theme);
    doc.documentElement.setAttribute('data-theme', theme);

    /* Pages CDN이 예전 style.css?v= 를 캐시하고 있어도 최신 CSS로 확인한다 */
    var link = doc.querySelector('link[rel="stylesheet"][href*="style.css"]');
    if (link && !link.getAttribute('data-bs')) {
      link.setAttribute('data-bs', '1');
      link.href = '/youtube-summary/assets/style.css?cb=' + Date.now();
      return false;
    }

    win.requestAnimationFrame(function () {
      win.requestAnimationFrame(function () {
        var info = card.querySelector('.yt-info');
        var infoBottomAbs = info.getBoundingClientRect().bottom + win.scrollY;
        var cardBottomAbs = card.getBoundingClientRect().bottom + win.scrollY;
        var y;
        if (mode === 'edge') y = Math.round(infoBottomAbs + 4);
        else if (mode === 'end') y = Math.round(cardBottomAbs - 22);
        else if (mode === 'head') y = Math.round(infoBottomAbs - 320);
        else if (mode === 'top') y = 0;
        else y = Math.round(infoBottomAbs + 420);
        win.scrollTo({ top: y, behavior: 'instant' });
        setTimeout(function () {
          var b = card.querySelector('.card-bar');
          var r = b.getBoundingClientRect();
          var cr = card.getBoundingClientRect();
          lbl.textContent = w + 'x' + h + ' · ' + theme + ' · ' + mode +
            ' | y ' + Math.round(win.scrollY) +
            ' | bar ' + r.top.toFixed(0) + '~' + r.bottom.toFixed(0) +
            ' x ' + r.left.toFixed(1) + '~' + r.right.toFixed(1) +
            ' | card ' + cr.top.toFixed(0) + '~' + cr.bottom.toFixed(0) +
            ' | ' + (b.className.indexOf('is-on') >= 0 ? 'ON' : 'off');
        }, 350);
      });
    });
    return true;
  }

  themes.forEach(function (theme) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = w + 'x' + h + ' · ' + theme + ' · ' + mode + ' (로딩)';
    var f = document.createElement('iframe');
    f.width = w;
    f.height = h;
    cell.appendChild(lbl);
    cell.appendChild(f);
    row.appendChild(cell);
    setTimeout(function () { f.src = '../index.html'; }, p.get('defer') ? 1500 : 0);

    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (start(f, lbl, theme) || tries > 40) clearInterval(timer);
    }, 250);
  });
})();
</script>
</body>
</html>
